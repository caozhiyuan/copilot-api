          if (!trimmed) {
            return null;
          }

          const authorizationMatch = trimmed.match(
            /^authorization\s*:\s*bearer\s+(.+)$/i
          );
          if (authorizationMatch) {
            return {
              header: "authorization",
              value: `Bearer ${authorizationMatch[1].trim()}`,
            };
          }

          const bearerMatch = trimmed.match(/^bearer\s+(.+)$/i);
          if (bearerMatch) {
            return {
              header: "authorization",
              value: `Bearer ${bearerMatch[1].trim()}`,
            };
          }

          const xApiKeyMatch = trimmed.match(/^x-api-key\s*:\s*(.+)$/i);
          if (xApiKeyMatch) {
            return {
              header: "x-api-key",
              value: xApiKeyMatch[1].trim(),
            };
          }

          return {
            header: "x-api-key",
            value: trimmed,
          };
        }

        function buildRequestHeaders() {
          const headers = {};
          const credential = parseCredential(apiKeyInput.value);
          if (credential) {
            headers[credential.header] = credential.value;
          }
          return headers;
        }

        function resolveUsageUrl(endpoint) {
          return new URL(endpoint, window.location.href).toString();
        }

        function deriveEndpointUrl(usageEndpoint, targetPath) {
          const url = new URL(usageEndpoint, window.location.href);
          const normalizedTargetPath = targetPath.replace(/^\/+/, "");
          const normalizedPath = url.pathname.replace(/\/+$/, "");
          const nextPath = normalizedPath.endsWith("/usage")
            ? normalizedPath.replace(/\/usage$/, `/${normalizedTargetPath}`)
            : `${normalizedPath || ""}/${normalizedTargetPath}`;

          url.pathname = nextPath.startsWith("/") ? nextPath : `/${nextPath}`;
          url.search = "";
          url.hash = "";
          return url.toString();
        }

        function buildTokenUsageSummaryUrl(usageEndpoint, period) {
          const url = new URL(deriveEndpointUrl(usageEndpoint, "token-usage"));
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageDailyUrl(usageEndpoint, period) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, "token-usage/daily")
          );
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageEventsUrl(
          usageEndpoint,
          period,
          page,
          kind = "events"
        ) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, `token-usage/${kind}`)
          );
          url.searchParams.set("period", period);
          url.searchParams.set("page", String(page));
          url.searchParams.set(
            "page_size",
            String(
              kind === "sessions"
                ? SESSION_PAGE_SIZE
                : DEFAULT_TOKEN_USAGE_EVENTS_PAGE_SIZE
            )
          );
          return url.toString();
        }

        async function fetchJson(url) {
          const response = await fetch(url, {
            headers: buildRequestHeaders(),
          });

          if (!response.ok) {
            let message = response.statusText || "Request failed";

            try {
              const contentType = response.headers.get("content-type") || "";
              if (contentType.includes("application/json")) {
                const payload = await response.json();
                const apiMessage = payload?.error?.message || payload?.message;
                if (typeof apiMessage === "string" && apiMessage.trim()) {
                  message = apiMessage.trim();
                }
              } else {
                const text = await response.text();
                if (text.trim()) {
                  message = text.trim();
                }
              }
            } catch (error) {
              console.warn(
                "Could not parse error response:",
                getErrorMessage(error)
              );
            }

            const error = new Error(
              `Request failed with status ${response.status}: ${message}`
            );
            error.status = response.status;
            throw error;
          }

          return response.json();
        }

        function syncUrlState() {
          try {
            const currentUrl = new URL(window.location.href);
            const endpoint = endpointUrlInput.value.trim();
            const period = getSelectedPeriod();
            if (state.activeTab === "usage") currentUrl.searchParams.delete("tab");
            else currentUrl.searchParams.set("tab", state.activeTab);

            if (endpoint) {
              currentUrl.searchParams.set("endpoint", endpoint);
            } else {
              currentUrl.searchParams.delete("endpoint");
            }

            currentUrl.searchParams.set("period", period);
            window.history.pushState({}, "", currentUrl);
          } catch (error) {
            console.warn("Could not update URL:", getErrorMessage(error));
          }
        }

        function updateControls() {
          const isLoading =
            state.activeTab === "models"
              ? state.isModelsLoading
              : state.activeTab === "subscriptions" ? state.isSubscriptionsLoading : state.isLoading;
          fetchButton.disabled = isLoading;
          fetchButtonLabel.textContent = isLoading
            ? "Refreshing..."
            : state.activeTab === "subscriptions" ? "Refresh all" : "Refresh";
          tokenUsagePeriodSelect.disabled =
            state.isLoading || state.isTokenUsageLoading;
          periodField.hidden = state.activeTab !== "usage";
          endpointForm.classList.toggle(
            "models-view",
            state.activeTab !== "usage"
          );
          contentArea.setAttribute("aria-labelledby", `${state.activeTab}-tab`);
          contentArea.setAttribute("aria-busy", String(isLoading));
          for (const button of tabButtons) {
            const selected = button.dataset.tab === state.activeTab;
            button.setAttribute("aria-selected", String(selected));
            button.tabIndex = selected ? 0 : -1;
          }
        }

        function formatNumber(value) {
          return Number.isFinite(value) ? Number(value).toLocaleString() : "0";
        }

        function formatCacheHitRate(usage) {
          const inputTokens =
            usage.input_tokens +
            usage.cache_read_input_tokens +
            usage.cache_creation_input_tokens;
          return inputTokens > 0
            ? `${((usage.cache_read_input_tokens / inputTokens) * 100).toFixed(1)}%`
            : "—";
        }

        function getMetricDisplayText(value) {
          return typeof value === "number" ? formatNumber(value) : value;
        }

        function resolveMetricValueFontSize(displayTexts) {
          const cards = Array.isArray(displayTexts)
            ? displayTexts
            : [displayTexts];
          const longest = cards.reduce((max, cardText) => {
            const lines = Array.isArray(cardText) ? cardText : [cardText];
            const cardMax = lines.reduce((m, line) => {
              return Math.max(m, String(line ?? "").length);
            }, 0);
            return Math.max(max, cardMax);
          }, 0);
          if (longest <= 7) return "";
          if (longest <= 11) return "clamp(15px, 1.3vw, 18px)";
          if (longest <= 15) return "clamp(13px, 1.1vw, 16px)";
          return "clamp(11px, 1vw, 14px)";
        }

        function formatCurrencyAmount(currency, amount) {
          const symbols = {
            CNY: "¥",
            USD: "$",
          };
          const normalizedCurrency =
            typeof currency === "string" && currency.trim()
              ? currency.trim().toUpperCase()
              : "";
          const symbol = symbols[normalizedCurrency] || "";
          return symbol
            ? `${symbol}${Number(amount).toFixed(6)}`
            : `${normalizedCurrency} ${Number(amount).toFixed(6)}`;
        }

        function getCostAmount(cost) {
          if (Number.isFinite(cost?.amount)) {
            return Number(cost.amount);
          }
          if (Number.isFinite(cost?.total_cost_nanos)) {
            return Number(cost.total_cost_nanos) / 1_000_000_000;
          }
          return null;
        }

        function formatTokenUsageCost(cost) {
          const amount = getCostAmount(cost);
          return amount === null || !cost?.currency
            ? "—"
            : formatCurrencyAmount(cost.currency, amount);
        }

        function formatTokenUsageCosts(costs) {
          if (!Array.isArray(costs) || costs.length === 0) {
            return ["—"];
          }
          return costs.map((cost) => formatTokenUsageCost(cost));
        }

        function formatLatency(value) {
          if (typeof value !== "number" || !Number.isFinite(value) || value < 0) return "—";
          return value < 1000 ? `${value.toFixed(0)} ms` : `${(value / 1000).toFixed(2)} s`;
        }

        function formatOutputSpeed(value) {
          return typeof value === "number" && Number.isFinite(value) && value >= 0
            ? `${value.toFixed(1)} tok/s` : "—";
        }

        function formatDateTime(value) {
          if (!Number.isFinite(value)) {
            return "N/A";
          }
          return new Date(value).toLocaleString();
        }

        function formatCellText(value) {
          if (typeof value !== "string") {
            return "—";
          }

          const trimmed = value.trim();
          return trimmed || "—";
        }

        function formatRangeDate(value) {
          const date = new Date(value);
          if (!Number.isFinite(date.getTime())) {
            return "N/A";
          }
          const options = { day: "numeric", month: "short" };
          if (date.getFullYear() !== new Date().getFullYear()) {
            options.year = "numeric";
          }
          return date.toLocaleDateString("en-US", options);
        }

        function formatRangeText(range) {
          const start = formatRangeDate(range.start_ms);
          const end = formatRangeDate(range.end_ms - 1);
          return start === end ? start : `${start} - ${end}`;
        }

        function renderTokenUsageRangeText(period, range) {
          const labels = {
            today: "Today",
            this_week: "This week",
            last_7_days: "Last 7 days",
            this_month: "This month",
            last_30_days: "Last 30 days",
            lifetime: "Lifetime",
          };
          const label = labels[period] || labels.today;

          if (!range || range.end_ms <= range.start_ms) {
            return label;
          }

          return `${label}: ${formatRangeText(range)}`;
        }

        /**
         * Renders the entire UI based on the current state.
         */
        function render(view = state.activeTab) {
          if (view !== state.activeTab) {
            return;
          }
          updateControls();

          if (state.activeTab === "models") {
            contentArea.innerHTML = renderModelsSection();
            createIcons();
            return;
          }

          if (state.activeTab === "subscriptions") {
            contentArea.innerHTML = renderSubscriptionUsageSection();
            createIcons();
            return;
          }

          if (state.isLoading) {
            contentArea.innerHTML = renderSpinner();
            createIcons();
            return;
          }

          const hasContent = Boolean(state.isTokenUsageLoading || state.isEventsLoading
            || state.tokenUsageSummary || state.tokenUsageDailySummary || state.tokenUsageEventsPage
            || state.tokenUsageSummaryError || state.tokenUsageDailyError || state.tokenUsageEventsError);
          contentArea.innerHTML = hasContent ? renderTokenUsageSection() : renderWelcomeMessage();

          // Replace placeholder icons with actual Lucide icons
          createIcons();
        }

        // --- Collapsible Sections ---
        const COLLAPSED_SECTIONS_STORAGE_KEY =
          "copilot-api:usage-viewer:collapsed";
        const COLLAPSIBLE_SECTION_KEYS = new Set([
          "tokenUsage",
          "modelBreakdown",
          "sessionBreakdown",
          "requestEvents",
        ]);

        function readCollapsedSections() {
          try {
            const raw = window.localStorage.getItem(
              COLLAPSED_SECTIONS_STORAGE_KEY
            );
            const parsed = raw ? JSON.parse(raw) : null;
            const collapsed = {};
            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
              for (const key of COLLAPSIBLE_SECTION_KEYS) {
                if (parsed[key] === true) {
                  collapsed[key] = true;
                }
              }
            }
            return collapsed;
          } catch (error) {
            console.warn(
              "Could not read collapsed sections:",
              getErrorMessage(error)
            );
            return {};
          }
        }

        function writeCollapsedSections() {
          try {
            window.localStorage.setItem(
              COLLAPSED_SECTIONS_STORAGE_KEY,
              JSON.stringify(state.collapsedSections)
            );
          } catch (error) {
            console.warn(
              "Could not store collapsed sections:",
              getErrorMessage(error)
            );
          }
        }

        function isSectionCollapsed(key) {
          return state.collapsedSections[key] === true;
        }

        function getCollapseBodyId(key) {
          return `collapse-body-${key}`;
        }

        /**
         * Renders the toggle button (chevron + label) shown in a section header.
         * @param {string} key - A COLLAPSIBLE_SECTION_KEYS entry.
         * @param {string} labelHtml - Trusted HTML for the toggle label.
         */
        function renderCollapseToggle(key, labelHtml) {
          return `<button type="button" class="collapse-toggle" data-collapse-toggle="${key}" aria-expanded="${!isSectionCollapsed(key)}" aria-controls="${getCollapseBodyId(key)}"><i data-lucide="chevron-down" class="collapse-chevron"></i>${labelHtml}</button>`;
        }

        /**
         * Opens a section body wrapper that is hidden while the section is
         * collapsed. Pair with renderCollapseBodyEnd() for multi-part bodies.
         * @param {string} key - A COLLAPSIBLE_SECTION_KEYS entry.
         * @param {string} className - Optional extra classes for the wrapper.
         */
        function renderCollapseBodyStart(key, className = "") {
          return `<div id="${getCollapseBodyId(key)}" class="collapse-body ${className}" ${isSectionCollapsed(key) ? "hidden" : ""}>`;
        }

        function renderCollapseBodyEnd() {
          return "</div>";
        }

        function renderCollapseBody(key, bodyHtml, className = "") {
          return `${renderCollapseBodyStart(key, className)}${bodyHtml}${renderCollapseBodyEnd()}`;
        }

        function toggleCollapsedSection(button) {
          const key = button.dataset.collapseToggle;
          if (!COLLAPSIBLE_SECTION_KEYS.has(key)) {
            return;
          }
          const collapsed = !isSectionCollapsed(key);
          if (collapsed) {
            state.collapsedSections[key] = true;
          } else {
            delete state.collapsedSections[key];
          }
          const body = document.getElementById(getCollapseBodyId(key));
          if (body) {
            body.hidden = collapsed;
          }
          button.setAttribute("aria-expanded", String(!collapsed));
          writeCollapsedSections();
        }

        function getModelField(model, fields) {
          for (const field of fields) {
            if (typeof model?.[field] === "string" && model[field].trim()) {
              return model[field];
            }
          }
          return "";
        }

        function getFilteredModels() {
          const query = state.modelsSearch.trim().toLowerCase();
          return (state.models || []).filter((model) => [
            getModelField(model, ["id"]),
            getModelField(model, ["display_name", "name"]),
            getModelField(model, ["owned_by", "vendor"]),
          ].some((value) => value.toLowerCase().includes(query)));
        }

        function getModelsCountText() {
          const total = state.models?.length || 0;
          return state.modelsSearch.trim()
            ? `${getFilteredModels().length} of ${total} models`
            : `${total} models`;
        }

        function renderModelsSection() {
          return `
            <section class="panel" aria-label="Available models">
              <div class="panel-header models-toolbar">
                <div>
                  <h2 class="panel-title">Models</h2>
                  <p id="models-count" class="panel-meta">${getModelsCountText()}</p>
                </div>
                <input
                  type="search"
                  class="input-control input-focus models-search"
                  data-model-search
                  aria-label="Search models by ID, name or vendor"
                  placeholder="Search by ID, name or vendor"
                  value="${escapeHtml(state.modelsSearch)}"
                  ${state.isModelsLoading || !state.models ? "disabled" : ""}
                />
              </div>
              <div id="models-results">${renderModelsResults()}</div>
              <p id="models-feedback" class="px-4 text-xs" role="status" aria-live="polite"></p>
            </section>
          `;
        }

        function renderModelsResults() {
          if (state.isModelsLoading) {
            return renderSpinner();
          }
          if (state.modelsError) {
            return `<div class="p-4">${renderError(state.modelsError, "Could not load models")}</div>`;
          }
          if (!state.models) {
            return renderEmptyState("Refresh to load models for this endpoint.");
          }
          if (state.models.length === 0) {
            return renderEmptyState("This endpoint returned no models.");
          }
          const models = getFilteredModels();
          if (models.length === 0) {
            return renderEmptyState("No models match your search.");
          }
          return `
            <div class="models-table-scroll">
              <table class="models-table" aria-label="Model list">
                <thead>
                  <tr>
                    <th scope="col" style="width: 40%;">Model ID</th>
                    <th scope="col" style="width: 28%;">Name</th>
                    <th scope="col" style="width: 18%;">Vendor</th>
                    <th scope="col" style="width: 14%;">Details</th>
                  </tr>
                </thead>
                <tbody>
                  ${models.map((model, index) => {
                    const id = getModelField(model, ["id"]);
                    const name = getModelField(model, ["display_name", "name"]);
                    const vendor = getModelField(model, ["owned_by", "vendor"]);
                    return `
                      <tr>
                        <td>
                          <div class="models-id">
                            <code>${escapeHtml(id || "—")}</code>
                            ${id ? `<button type="button" class="models-action" data-model-copy="${escapeHtml(id)}" aria-label="Copy model ID ${escapeHtml(id)}"><i data-lucide="copy" class="h-3 w-3" aria-hidden="true"></i>Copy</button>` : ""}
                          </div>
                        </td>
                        <td>${escapeHtml(name || "—")}</td>
                        <td>${escapeHtml(vendor || "—")}</td>
                        <td><button type="button" class="models-action" data-model-details="model-details-${index}" aria-controls="model-details-${index}" aria-expanded="false">View JSON</button></td>
                      </tr>
                      <tr id="model-details-${index}" hidden>
                        <td colspan="4" class="models-json-cell"><pre class="models-json">${escapeHtml(JSON.stringify(model, null, 2))}</pre></td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        function getConnectionKey() {
          return JSON.stringify([
            endpointUrlInput.value.trim(),
            apiKeyInput.value.trim(),
          ]);
        }

        function syncModelsConnection() {
          const key = getConnectionKey();
          if (state.modelsConnectionKey !== key) {
            state.modelsConnectionKey = key;
            state.modelsRequestId += 1;
            state.models = null;
            state.modelsError = null;
            state.isModelsLoading = false;
          }
        }

        function syncSubscriptionsConnection() {
          const key = getConnectionKey();
          if (state.subscriptionsConnectionKey !== key) {
            state.subscriptionsConnectionKey = key;
            state.subscriptionRequestId += 1;
            state.subscriptionUsage = {};
            state.subscriptionUsageErrors = {};
            state.subscriptionLoadingProviders = {};
            state.subscriptionsLoaded = false;
            state.isSubscriptionsLoading = false;
            state.subscriptionPageError = null;
          }
        }

        function handleModelsConnectionChange() {
          syncModelsConnection();
          syncSubscriptionsConnection();
          if (state.activeTab === "models" || state.activeTab === "subscriptions") {
            render();
          }
        }

        async function fetchModels() {
          syncEndpointCredential();
          syncModelsConnection();
          const connectionKey = state.modelsConnectionKey;
          const requestId = ++state.modelsRequestId;
          const isCurrentRequest = () =>
            requestId === state.modelsRequestId
            && connectionKey === getConnectionKey();
          state.models = null;
          state.modelsError = null;
          state.isModelsLoading = true;
          render("models");
          try {
            const endpoint = endpointUrlInput.value.trim();
            if (!endpoint) {
              throw new Error("Endpoint URL cannot be empty.");
            }
            const payload = await fetchJson(deriveEndpointUrl(endpoint, "models"));
            if (!Array.isArray(payload?.data)) {
              throw new Error("Model response must contain a data array.");
            }
            if (isCurrentRequest()) {
              state.models = payload.data;
            }
          } catch (error) {
            if (isCurrentRequest()) {
              state.modelsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isModelsLoading = false;
              render("models");
            }
          }
        }

        function activateTab(tab) {
          if (!["usage", "subscriptions", "models"].includes(tab)) {
            return;
          }
          syncEndpointCredential();
          syncModelsConnection();
          syncSubscriptionsConnection();
          state.activeTab = tab;
          syncUrlState();
          render();
          if (tab === "models" && !state.models && !state.isModelsLoading) {
            void fetchModels();
          }
          if (tab === "subscriptions" && !state.subscriptionsLoaded && !state.isSubscriptionsLoading) {
            void refreshSubscriptionQuotas();
          }
        }

        function handleTabsKeydown(event) {
          const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
          if (!keys.includes(event.key)) {
            return;
          }
          event.preventDefault();
          const index = tabButtons.findIndex((button) => button.dataset.tab === state.activeTab);
          const nextIndex = event.key === "Home" ? 0
            : event.key === "End" ? tabButtons.length - 1
            : (index + (event.key === "ArrowRight" ? 1 : -1) + tabButtons.length) % tabButtons.length;
          activateTab(tabButtons[nextIndex].dataset.tab);
          tabButtons[nextIndex].focus();
        }

        function handleModelsSearch(event) {
          if (!event.target.matches("[data-model-search]")) {
            return;
          }
          state.modelsSearch = event.target.value;
          document.getElementById("models-results").innerHTML =
            renderModelsResults();
          document.getElementById("models-count").textContent = getModelsCountText();
          document.getElementById("models-feedback").textContent = "";
          createIcons();
        }

        async function copyModelId(id) {
          const feedback = document.getElementById("models-feedback");
          try {
            await navigator.clipboard.writeText(id);
            feedback.textContent = "Model ID copied.";
          } catch {
            feedback.textContent =
              "Could not copy. Select the model ID and copy it manually.";
          }
          feedback.classList.add("py-3");
        }

        // Subscription quotas use the same normalized server response as desktop.
        function subscriptionQuotaLabel(window) {
          let label = "Included allowance";
          if (window.id.startsWith("copilot:")) return window.name || "Premium";
          if (window.kind === "spend") return "Monthly credit limit";
          if (window.kind === "on-demand") return "Pay as you go · Monthly";
          const seconds = window.windowSeconds;
          if (window.period === "weekly" || seconds === 604800) label = "Weekly limit";
          else if (window.period === "monthly") label = "Monthly limit";
          else if (Number.isFinite(seconds) && seconds >= 86400) label = `${seconds / 86400}-day limit`;
          else if (Number.isFinite(seconds) && seconds >= 3600) label = `${seconds / 3600}-hour limit`;
          else if (Number.isFinite(seconds) && seconds > 0) label = `${seconds / 60}-minute limit`;
          return window.name ? `${window.name} · ${label}` : label;
        }

        function formatSubscriptionAmount(value, unit) {
          if (!Number.isFinite(value)) return "—";
          return unit === "USD"
            ? value.toLocaleString(undefined, { style: "currency", currency: "USD" })
            : value.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }

        function renderSubscriptionQuotaWindow(window) {
          const percent = window.usedPercent;
          const hasPercent = Number.isFinite(percent) && !window.unlimited;
          const width = hasPercent ? Math.min(100, Math.max(0, percent)) : 0;
          const label = escapeHtml(subscriptionQuotaLabel(window));
          const reset = Number.isFinite(window.resetAt) ? new Date(window.resetAt * 1000) : null;
          const resetDate = window.resetDate || (reset && Number.isFinite(reset.getTime()) ? reset.toLocaleString() : null);
          return `
            <div class="quota-window" data-warning="${Boolean(window.limitReached || percent >= 90)}">
              <div class="quota-window-heading"><span>${label}</span><span>${window.unlimited ? "Unlimited" : hasPercent ? `${Math.round(percent * 10) / 10}% used` : "—"}</span></div>
              ${hasPercent ? `<div role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${width}" class="quota-progress"><div class="quota-progress-fill" style="width: ${width}%;"></div></div>` : ""}
              ${!window.unlimited && (window.used !== undefined || window.limit !== undefined) ? `<p class="quota-window-note">${formatSubscriptionAmount(window.used, window.unit)} / ${formatSubscriptionAmount(window.limit, window.unit)}${window.unit === "credits" ? " Credits" : window.unit === "requests" ? " requests" : ""}</p>` : ""}
              ${resetDate ? `<p class="quota-window-note">Resets ${escapeHtml(resetDate)}</p>` : ""}
            </div>
          `;
        }

        function renderSubscriptionSummary(usage) {
          const main = usage.windows.find((window) => window.kind === "usage") || usage.windows[0];
          const credits = usage.credits;
          const showCredits = credits && (credits.unlimited || (credits.hasCredits && credits.balance !== undefined) || !main);
          const value = showCredits ? credits.unlimited ? "∞"
            : formatSubscriptionAmount(credits.balance, credits.unit)
            : main?.unlimited ? "∞"
              : Number.isFinite(main?.usedPercent) ? `${formatSubscriptionAmount(Math.max(0, Math.min(100, 100 - main.usedPercent)))}%` : "—";
          const label = showCredits ? credits.unit === "USD" ? "Prepaid balance" : "Credits" : "Remaining allowance";
          return `<div class="quota-summary"><p class="quota-summary-label">${label}</p><div class="quota-summary-value">${value}</div><p class="quota-summary-context">${showCredits ? credits.unlimited ? "Unlimited" : "Available balance" : main ? escapeHtml(subscriptionQuotaLabel(main)) : "Included allowance"}</p></div>`;
        }

        function renderSubscriptionUsageSection() {
          const ids = Object.keys(SUBSCRIPTION_PROVIDERS).filter((provider) => state.subscriptionUsage?.[provider] || state.subscriptionUsageErrors?.[provider] || state.subscriptionLoadingProviders?.[provider]);
          const cards = ids.map((provider) => {
            const meta = SUBSCRIPTION_PROVIDERS[provider];
            const usage = state.subscriptionUsage?.[provider];
            const failed = state.subscriptionUsageErrors?.[provider];
            const loading = state.subscriptionLoadingProviders?.[provider];
            const credits = usage?.credits;
            let balance = "—";
            if (credits?.unlimited) balance = "Unlimited";
            else if (Number.isFinite(credits?.balance)) balance = formatSubscriptionAmount(credits.balance, credits.unit);
            else if (credits?.hasCredits) balance = "Available";
            let limitMessage = "Usage limit reached";
            if (usage?.limitReason === "workspace_owner_credits_depleted" || usage?.limitReason === "workspace_member_credits_depleted") limitMessage = "Workspace credits are depleted";
            if (usage?.limitReason === "workspace_owner_usage_limit_reached" || usage?.limitReason === "workspace_member_usage_limit_reached") limitMessage = "Workspace spending limit reached";
            const stateName = loading ? "loading" : failed || usage?.limitReached ? "warning" : "ready";
            const status = loading ? "Loading…" : failed ? "Could not load" : usage?.limitReached ? "Limit reached" : "Available";
            return `
              <section class="quota-provider-card" data-provider="${provider}" aria-label="${meta.name} subscription quota">
                <div class="quota-card-header"><span class="quota-provider-logo"><img src="${meta.logo}" alt="" /></span><div style="min-width: 0; flex: 1;"><h3>${meta.name}</h3><p class="quota-provider-product">${meta.product}</p></div><button class="quota-refresh" type="button" data-quota-refresh="${provider}" aria-label="Refresh ${meta.name} quota" title="Refresh" ${loading ? "disabled" : ""}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" /><path d="M6.1 7a7 7 0 0 1 11.6-2L20 8M4 16l2.3 3A7 7 0 0 0 18 17" /></svg></button></div>
                <div class="quota-card-meta"><span class="quota-plan">${escapeHtml(usage?.planType || meta.product)}</span><span class="quota-status" data-state="${stateName}"><span></span>${status}</span></div>
                ${loading ? `<div class="quota-skeleton" aria-label="Loading"><div></div><div></div><div></div></div>` : failed ? `<p role="alert" class="quota-card-message">Could not load quota. Refresh to retry.</p>` : `${renderSubscriptionSummary(usage)}<div class="quota-details">${usage.limitReached ? `<p class="quota-notice">${limitMessage}</p>` : ""}${usage.windows.map(renderSubscriptionQuotaWindow).join("")}${credits && usage.windows.length ? `<div class="quota-balance"><span>${credits.unit === "USD" ? "Prepaid balance" : "Credits"}</span><strong>${balance}</strong></div>` : ""}${!usage.windows.length && !credits && !usage.limitReached ? `<p class="quota-window-note">No quota details reported.</p>` : ""}</div>`}
                <div class="quota-card-footer">Subscription allowance · Refresh anytime</div>
              </section>
            `;
          }).join("");
          const empty = state.subscriptionPageError || (state.subscriptionsLoaded ? "No subscriptions available. Enable a subscription provider and refresh." : "Refresh to load your subscription allowances.");
          return `<section id="subscription-quotas" class="subscriptions-page"><div class="subscriptions-page-heading"><div><p class="subscriptions-eyebrow">ACCOUNT USAGE</p><h2>Subscriptions</h2><p class="subscriptions-description">Your subscriptions, balances and reset times in one place.</p></div>${ids.length ? `<span class="subscriptions-count"><span></span>${ids.length} providers</span>` : ""}</div>${cards ? `<div class="subscriptions-grid">${cards}</div>` : `<div class="subscriptions-empty"><h3>Your subscriptions will appear here</h3><p>${escapeHtml(empty)}</p></div>`}</section>`;
        }

        function renderTokenUsageSection() {
          const hasTokenUsageContent = Boolean(
            state.isTokenUsageLoading
              || state.isEventsLoading
              || state.tokenUsageDailySummary
              || state.tokenUsageSummary
              || state.tokenUsageEventsPage
              || state.tokenUsageDailyError
              || state.tokenUsageSummaryError
              || state.tokenUsageEventsError
          );

          if (!hasTokenUsageContent) {
            return "";
          }

          const summary = state.tokenUsageSummary;
          const dailySummary = state.tokenUsageDailySummary;
          const eventsPage = state.tokenUsageEventsPage;
          const sessionsPage = state.tokenUsageSessionsPage;
          const totals = summary?.totals || EMPTY_TOKEN_USAGE_TOTALS;
          const activeRange =
            summary?.range || dailySummary?.range || eventsPage?.range || null;
          const totalPages = eventsPage ? Math.max(eventsPage.total_pages, 1) : 1;
          const eventsMeta = eventsPage
            ? `Page ${eventsPage.page} / ${totalPages} - ${formatNumber(
                eventsPage.total
              )} events`
            : "No detail page loaded yet.";

          return `
            <section id="token-usage" class="dashboard-section">
              <div class="mb-2 flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                <div>
                  <h2 class="section-heading mb-1">
                    ${renderCollapseToggle(
                      "tokenUsage",
                      `<i data-lucide="database" class="h-5 w-5" style="color: var(--color-blue);"></i><span>Token Usage</span>`
                    )}
                  </h2>
                  <p class="section-subtitle mb-0">${escapeHtml(
                    renderTokenUsageRangeText(state.tokenUsagePeriod, activeRange)
                  )}</p>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs font-medium" style="color: var(--color-gray);">
                  ${
                    state.isTokenUsageLoading
                      ? `<span class="rounded-md px-2 py-1" style="background-color: rgba(37, 99, 235, 0.08); color: var(--color-blue);">Refreshing summary...</span>`
                      : ""
                  }
                  ${
                    state.isEventsLoading
                      ? `<span class="rounded-md px-2 py-1" style="background-color: rgba(37, 99, 235, 0.08); color: var(--color-blue);">Refreshing details...</span>`
                      : ""
                  }
                </div>
              </div>

              ${renderCollapseBodyStart("tokenUsage")}
              ${
                state.tokenUsageSummaryError
                  ? renderError(
                      state.tokenUsageSummaryError,
                      "Token usage summary failed"
                    )
                  : ""
              }

              <div class="metric-grid metric-grid-tight ${
                state.isTokenUsageLoading ? "opacity-60" : ""
              }">
                ${
                  (() => {
                    const metricFontSize = resolveMetricValueFontSize([
                      getMetricDisplayText(totals.total_tokens),
                      getMetricDisplayText(totals.input_tokens),
                      getMetricDisplayText(totals.output_tokens),
                      getMetricDisplayText(totals.cache_read_input_tokens),
                      getMetricDisplayText(totals.cache_creation_input_tokens),
                      formatCacheHitRate(totals),
                      getMetricDisplayText(totals.request_count),
                      formatTokenUsageCosts(totals.costs),
                    ]);
                    const costCurrencies = [
                      ...new Set(totals.costs.map((cost) => cost.currency)),
                    ];
                    return [
                      renderTokenUsageMetric(
                        "Total",
                        totals.total_tokens,
                        "var(--color-fg-lightest)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Input",
                        totals.input_tokens,
                        "var(--color-blue-accent)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Output",
                        totals.output_tokens,
                        "var(--color-green-accent)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Cache Read",
                        totals.cache_read_input_tokens,
                        "var(--color-aqua-accent)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Cache Write",
                        totals.cache_creation_input_tokens,
                        "var(--color-yellow-accent)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Cache Hit Rate",
                        formatCacheHitRate(totals),
                        "var(--color-aqua-accent)",
                        metricFontSize
                      ),
                      renderTokenUsageMetric(
                        "Requests",
                        totals.request_count,
                        "var(--color-purple-accent)",
                        metricFontSize
                      ),
                      ...(costCurrencies.length > 0
                        ? costCurrencies.map((currency) =>
                            renderTokenUsageCostMetric(
                              `Cost (${currency})`,
                              formatTokenUsageCost(
                                totals.costs.find(
                                  (cost) => cost.currency === currency
                                )
                              ),
                              "var(--color-yellow-accent)",
                              metricFontSize
                            )
                          )
                        : [
                            renderTokenUsageCostMetric(
                              "Cost",
                              formatTokenUsageCosts(totals.costs),
                              "var(--color-yellow-accent)",
                              metricFontSize
                            ),
                          ]),
                    ].join("");
                  })()
                }
              </div>

              ${renderTokenUsageDailyTrend(
                dailySummary,
                state.tokenUsageDailyError
              )}

              <div class="mt-3 grid grid-cols-1 gap-3">
                <div class="panel">
                  <div class="panel-header">
                    <div>
                      <p class="panel-title">${renderCollapseToggle("modelBreakdown", "<span>Model Breakdown</span>")}</p>
                      <p class="panel-meta">${summary ? `${formatNumber(summary.byModel.length)} models` : "No summary rows loaded."}</p>
                    </div>
                  </div>
                  ${renderCollapseBody(
                    "modelBreakdown",
                    renderTokenUsageModelBreakdown(summary)
                  )}
                </div>

                <div class="panel">
                  <div class="panel-header">
                    <div>
                      <p class="panel-title">${renderCollapseToggle("sessionBreakdown", "<span>Session Breakdown</span>")}</p>
                      <p class="panel-meta">${sessionsPage ? `Page ${sessionsPage.page} / ${sessionsPage.total_pages} - ${formatNumber(sessionsPage.total)} sessions` : "No session rows loaded."}</p>
                    </div>
                    <div class="flex items-center gap-2">
                      <button type="button" data-session-page="-1" class="pill-button px-3 py-1.5 text-xs font-semibold" ${!sessionsPage || state.isSessionsLoading || sessionsPage.page <= 1 ? "disabled" : ""}>Previous</button>
                      <button type="button" data-session-page="1" class="pill-button px-3 py-1.5 text-xs font-semibold" ${!sessionsPage || state.isSessionsLoading || sessionsPage.page >= sessionsPage.total_pages ? "disabled" : ""}>Next</button>
                    </div>
                  </div>
                  ${renderCollapseBodyStart("sessionBreakdown")}
                  ${
                    state.tokenUsageSessionsError
                      ? `<div class="p-4">${renderError(
                          state.tokenUsageSessionsError,
                          "Session breakdown failed"
                        )}<button type="button" data-session-page="0" class="pill-button mt-2 px-3 py-1.5 text-xs font-semibold">Retry</button></div>`
                      : ""
                  }
                  ${renderTokenUsageModelBreakdown({ bySession: sessionsPage?.items }, "session")}
                  ${renderCollapseBodyEnd()}
                </div>

                <div class="panel">
                  <div class="panel-header flex-col items-start sm:flex-row sm:items-center">
                    <div>
                      <p class="panel-title">${renderCollapseToggle("requestEvents", "<span>Request Events</span>")}</p>
                      <p class="panel-meta">${escapeHtml(eventsMeta)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                      ${renderPaginationButton(
                        "previous",
                        "Previous",
                        !eventsPage || state.isEventsLoading || eventsPage.page <= 1
                      )}
                      ${renderPaginationButton(
                        "next",
                        "Next",
                        !eventsPage
                          || state.isEventsLoading
                          || eventsPage.page >= totalPages
                      )}
                    </div>
                  </div>
                  ${renderCollapseBodyStart("requestEvents")}
                  ${
                    state.tokenUsageEventsError
                      ? `<div class="p-4">${renderError(
                          state.tokenUsageEventsError,
                          "Token usage details failed"
                        )}</div>`
                      : ""
                  }
                  ${renderTokenUsageEventsTable(eventsPage)}
                  ${renderCollapseBodyEnd()}
                </div>
              </div>
              ${renderCollapseBodyEnd()}
            </section>
          `;
        }

        function getTokenUsageTrendMetrics() {
          return [
            {
              color: "var(--color-fg-lightest)",
              key: "total_tokens",
              label: "Total",
            },
            {
              color: "var(--color-blue-accent)",
              key: "input_tokens",
              label: "Input",
            },
            {
              color: "var(--color-green-accent)",
              key: "output_tokens",
              label: "Output",
            },
            {
              color: "var(--color-aqua-accent)",
              key: "cache_read_input_tokens",
              label: "Cache Read",
            },
            {
              color: "var(--color-yellow-accent)",
              key: "cache_creation_input_tokens",
              label: "Cache Write",
            },
          ];
        }

        function getDailyTrendTotals(day, selectedModel) {
          if (selectedModel === ALL_MODELS_VALUE) {
            return day.totals || EMPTY_TOKEN_USAGE_TOTALS;
          }

          return (
            day.byModel?.find((model) => model.model === selectedModel)
            || EMPTY_TOKEN_USAGE_TOTALS
          );
        }

        function formatChartDate(value) {
          const parts = String(value).split("-");
          return parts.length === 3 ? `${parts[1]}/${parts[2]}` : value;
        }

        function getTokenUsageTrendDays(dailySummary, selectedModel) {
          const days = dailySummary?.days || [];
          if (
            state.tokenUsagePeriod !== "lifetime"
            || days.length <= MAX_LIFETIME_TREND_POINTS
          ) {
            return days;
          }

          const usageIndexes = days.reduce((indexes, day, index) => {
            if (getDailyTrendTotals(day, selectedModel).request_count > 0) {
              indexes.push(index);
            }
            return indexes;
          }, []);
          if (usageIndexes.length >= MAX_LIFETIME_TREND_POINTS) {
            const step =
              (usageIndexes.length - 1) / (MAX_LIFETIME_TREND_POINTS - 1);
            return Array.from(
              { length: MAX_LIFETIME_TREND_POINTS },
              (_, index) => days[usageIndexes[Math.round(index * step)]]
            );
          }
          const indexes = new Set(usageIndexes);
          const sampleCount = Math.max(
            1,
            MAX_LIFETIME_TREND_POINTS - usageIndexes.length
          );
          const step = (days.length - 1) / (sampleCount - 1 || 1);
          for (let index = 0; index < sampleCount; index += 1) {
            indexes.add(Math.round(index * step));
          }
          return [...indexes]
            .sort((left, right) => left - right)
            .slice(0, MAX_LIFETIME_TREND_POINTS)
            .map((index) => days[index]);
        }

        function renderTokenUsageDailyTrend(dailySummary, error) {
          if (state.tokenUsagePeriod === "today") {
            return "";
          }

          const models = dailySummary?.byModel || [];
          const selectedModel = models.some(
            (model) => model.model === state.tokenUsageTrendModel
          )
            ? state.tokenUsageTrendModel
            : ALL_MODELS_VALUE;
          const options = [
            `<option value="${ALL_MODELS_VALUE}">All models</option>`,
            ...models.map(
              (model) =>
                `<option value="${escapeHtml(model.model)}" ${
                  selectedModel === model.model ? "selected" : ""
                }>${escapeHtml(model.model)}</option>`
            ),
          ].join("");

          return `
            <div class="mt-3 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_304px] gap-3">
              <div class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Token Usage Over Time</p>
                    <p class="panel-meta">${escapeHtml(
                      renderTokenUsageRangeText(
                        state.tokenUsagePeriod,
                        dailySummary?.range || null
                      )
                    )}</p>
                  </div>
                </div>
                ${
                  error
                    ? `<div class="p-4">${renderError(
                        error,
                        "Token usage daily trend failed"
                      )}</div>`
                    : ""
                }
                ${renderTokenUsageTrendChart(dailySummary, selectedModel)}
              </div>

              <aside class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Filters</p>
                    <p class="panel-meta">Applied to the trend chart</p>
                  </div>
                </div>
                <div class="p-4 space-y-4">
                  <div>
                    <label class="field-label">Model</label>
                    <select
                      data-token-usage-trend-model
                      class="select-control input-focus text-sm"
                    >${options}</select>
                  </div>
                  <div>
                    <div class="field-label">Metric</div>
                    <div class="flex flex-wrap gap-2">
                      ${renderTokenUsageTrendMetricButtons()}
                    </div>
                  </div>
                </div>
              </aside>
            </div>
          `;
        }

        function renderTokenUsageTrendMetricButtons() {
          const metrics = getTokenUsageTrendMetrics();
          return [
            {
              color: "var(--color-fg-lightest)",
              key: ALL_METRICS_VALUE,
              label: "All",
            },
            ...metrics,
          ]
            .map((metric) => {
              const isActive = state.tokenUsageTrendMetric === metric.key;
              return `
                <button
                  type="button"
                  data-trend-metric="${metric.key}"
                  class="pill-button inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold"
                  style="background-color: ${isActive ? "rgba(37, 99, 235, 0.1)" : "var(--color-bg)"}; border-color: ${isActive ? "rgba(37, 99, 235, 0.28)" : "var(--color-bg-light-2)"}; color: ${isActive ? "var(--color-blue)" : "var(--color-fg-medium)"};"
                >
                  <span class="h-2 w-2 rounded-full" style="background-color: ${metric.color};"></span>
                  ${escapeHtml(metric.label)}
                </button>
              `;
            })
            .join("");
        }

        function renderTokenUsageTrendChart(dailySummary, selectedModel) {
          const metrics = getTokenUsageTrendMetrics();
          const visibleMetrics =
            state.tokenUsageTrendMetric === ALL_METRICS_VALUE
              ? metrics
              : metrics.filter(
                  (metric) => metric.key === state.tokenUsageTrendMetric
                );
          const days = getTokenUsageTrendDays(dailySummary, selectedModel);
          const hasUsage = days.some(
            (day) => getDailyTrendTotals(day, selectedModel).request_count > 0
          );
          const latestUsageIndex = days.reduce((latest, day, index) => {
            return getDailyTrendTotals(day, selectedModel).request_count > 0
              ? index
              : latest;
          }, -1);
          const selectedDayIndex = days.findIndex(
            (day) => day.date === state.tokenUsageTrendDay
          );
          const activeIndex =
            selectedDayIndex >= 0
              ? selectedDayIndex
              : latestUsageIndex >= 0
                ? latestUsageIndex
                : Math.max(0, days.length - 1);
          const activeDay = days[activeIndex];
          const activeTotals = activeDay
            ? getDailyTrendTotals(activeDay, selectedModel)
            : EMPTY_TOKEN_USAGE_TOTALS;

          if (state.isTokenUsageLoading && !dailySummary) {
            return `<div class="p-4 min-h-[14rem] text-sm animate-pulse" style="color: var(--color-gray);">Loading...</div>`;
          }

          if (!dailySummary || days.length === 0 || !hasUsage) {
            return renderEmptyState(
              "No token usage recorded for the selected period."
            );
          }

          const width = 720;
          const height = 220;
          const padding = { bottom: 34, left: 58, right: 16, top: 16 };
          const plotWidth = width - padding.left - padding.right;
          const plotHeight = height - padding.top - padding.bottom;
          const allValues = days.flatMap((day) => {
            const totals = getDailyTrendTotals(day, selectedModel);
            return visibleMetrics.map((metric) => totals[metric.key] || 0);
          });
          const maxValue = Math.max(1, ...allValues);
          const xForIndex = (index) =>
            days.length <= 1
              ? padding.left + plotWidth / 2
              : padding.left + (plotWidth * index) / (days.length - 1);
          const hitWidth =
            days.length <= 1 ? plotWidth : plotWidth / (days.length - 1);
          const yForValue = (value) =>
            padding.top
            + plotHeight
            - (Math.max(0, value) / maxValue) * plotHeight;
          const labelEvery = Math.max(1, Math.ceil(days.length / 6));
          const yTicks = [0, 0.25, 0.5, 0.75, 1].map((ratio) =>
            Math.round(maxValue * ratio)
          );

          const grid = yTicks
            .map((tick) => {
              const y = yForValue(tick);
              return `
                <line x1="${padding.left}" x2="${
                  width - padding.right
                }" y1="${y}" y2="${y}" stroke="var(--color-bg-light-2)" stroke-width="1" />
                <text x="${padding.left - 8}" y="${
                  y + 4
                }" text-anchor="end" font-size="11" fill="var(--color-gray-accent)">${formatNumber(
                  tick
                )}</text>
              `;
            })
            .join("");
          const xLabels = days
            .map((day, index) => {
              if (index % labelEvery !== 0 && index !== days.length - 1) {
                return "";
              }
              return `<text x="${xForIndex(index)}" y="${
                height - 10
              }" text-anchor="middle" font-size="11" fill="var(--color-gray-accent)">${escapeHtml(
                formatChartDate(day.date)
              )}</text>`;
            })
            .join("");
          const lines = visibleMetrics
            .map((metric) => {
              const points = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  return `${xForIndex(index)},${yForValue(
                    totals[metric.key] || 0
                  )}`;
                })
                .join(" ");
              const circles = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  const value = totals[metric.key] || 0;
                  return `<circle cx="${xForIndex(index)}" cy="${yForValue(
                    value
                  )}" r="2.5" fill="${
                    metric.color
                  }" data-trend-day="${escapeHtml(day.date)}">
                    <title>${escapeHtml(
                      `${formatChartDate(day.date)} ${metric.label}: ${formatNumber(
                        value
                      )}`
                    )}</title>
                  </circle>`;
                })
                .join("");
              return `
                <polyline fill="none" points="${points}" stroke="${metric.color}" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25">
                  <title>${escapeHtml(metric.label)}</title>
                </polyline>
                ${circles}
              `;
            })
            .join("");
          const activeMarker = activeDay
            ? `<line x1="${xForIndex(activeIndex)}" x2="${xForIndex(
                activeIndex
              )}" y1="${padding.top}" y2="${
                padding.top + plotHeight
              }" stroke="var(--color-bg-light-4)" stroke-dasharray="4 4" stroke-width="1" />`
            : "";
          const hitRects = days
            .map((day, index) => {
              const x = xForIndex(index);
              const hitStart = Math.max(padding.left, x - hitWidth / 2);
              const hitEnd = Math.min(
                width - padding.right,
                x + hitWidth / 2
              );
              const totals = getDailyTrendTotals(day, selectedModel);
              const title = [
                formatChartDate(day.date),
                ...visibleMetrics.map(
                  (metric) =>
                    `${metric.label}: ${formatNumber(
                      totals[metric.key] || 0
                    )}`
                ),
              ].join("\n");
              return `<rect x="${hitStart}" y="${padding.top}" width="${
                hitEnd - hitStart
              }" height="${plotHeight}" fill="transparent" style="cursor: pointer;" data-trend-day="${escapeHtml(day.date)}">
                <title>${escapeHtml(title)}</title>
              </rect>`;
            })
            .join("");
          const legend = [
            ...metrics.map(
              (metric) => `
                <span class="inline-flex items-center gap-1.5 text-xs font-medium" style="color: var(--color-gray);">
                  <span class="h-2 w-2 rounded-full" style="background-color: ${
                    metric.color
                  };"></span>
                  ${escapeHtml(metric.label)}
                </span>
              `
            ),
          ].join("");
          const activeValues = activeDay
            ? `
              <div class="mt-2 flex flex-wrap gap-3 px-3 py-2 text-xs" style="background-color: var(--color-bg-soft); color: var(--color-fg-dark);">
                <span class="font-semibold" style="color: var(--color-fg-lightest);">${escapeHtml(
                  formatChartDate(activeDay.date)
                )}</span>
                ${visibleMetrics
                  .map(
                    (metric) =>
                      `<span>${escapeHtml(metric.label)}: ${formatNumber(
                        activeTotals[metric.key] || 0
                      )}</span>`
                  )
                  .join("")}
              </div>
            `
            : "";

        function renderPaginationButton(action, label, disabled) {

        function renderEmptyState(message) {

            </div>

        }

        /**
         * Renders a loading spinner.

        function renderSpinner() {
          return `
            <div class="flex justify-center items-center py-20">
                <div class="animate-spin h-12 w-12 rounded-full border-4 border-transparent border-t-4" style="border-top-color: var(--color-blue); background-color: rgba(255, 255, 255, 0.65);"></div>

        /**
         * Renders an error message box.

          return `
            <div
              class="p-3 border rounded-lg"

              role="alert"

        /**
         * Renders a welcome message when the page first loads.
         * @returns {string} HTML string for the welcome message.
         */
        function renderWelcomeMessage() {
          return `
            <div class="panel text-center py-16 px-4">
                <i data-lucide="info" class="mx-auto h-10 w-10" style="color: var(--color-blue);"></i>
                <h3 class="mt-3 text-lg font-bold" style="color: var(--color-fg-lightest);">Usage data is ready to load</h3>
                <p class="mt-2 text-sm" style="color: var(--color-gray);">Refresh the configured endpoint to view token totals, trends, and request events. Open Subscriptions for account allowances.</p>
            </div>
          `;
        }

        // --- Data Fetching ---

        async function refreshSubscriptionQuotas(provider) {
          syncSubscriptionsConnection();
          try {
            if (!endpointUrlInput.value.trim()) throw new Error("Endpoint URL cannot be empty.");
            await fetchSubscriptionQuotas(resolveUsageUrl(endpointUrlInput.value.trim()), provider);
          } catch (error) {
            state.subscriptionPageError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        async function fetchSubscriptionQuotas(usageUrl, selectedProvider) {
          if (selectedProvider && !Object.hasOwn(SUBSCRIPTION_PROVIDERS, selectedProvider)) return;
          if (!selectedProvider) {
            state.subscriptionRequestId += 1;
            state.subscriptionUsage = {};
            state.subscriptionUsageErrors = {};
            state.subscriptionLoadingProviders = {};
          }
          const requestId = state.subscriptionRequestId;
          const connectionKey = getConnectionKey();
          state.subscriptionPageError = null;
          const providers = selectedProvider ? [selectedProvider] : Object.keys(SUBSCRIPTION_PROVIDERS);
          await Promise.all(providers.map(async (provider) => {
            const revision = (state.subscriptionRequests[provider] || 0) + 1;
            state.subscriptionRequests[provider] = revision;
            delete state.subscriptionUsage[provider];
            delete state.subscriptionUsageErrors[provider];
            state.subscriptionLoadingProviders[provider] = true;
            state.isSubscriptionsLoading = true;
            render("subscriptions");
            const isCurrent = () => requestId === state.subscriptionRequestId
              && connectionKey === getConnectionKey() && revision === state.subscriptionRequests[provider];
            try {
              const usage = await fetchJson(deriveEndpointUrl(usageUrl, `usage/${provider}`));
              if (!isCurrent()) return;
              if (usage?.provider !== provider || !Array.isArray(usage.windows)) throw new Error("Invalid subscription quota response");
              state.subscriptionUsage[provider] = usage;
            } catch (error) {
              if (!isCurrent()) return;
              if (error?.status !== 404) state.subscriptionUsageErrors[provider] = true;
            } finally {
              if (isCurrent()) {
                delete state.subscriptionLoadingProviders[provider];
                state.isSubscriptionsLoading = Object.keys(state.subscriptionLoadingProviders).length > 0;
                state.subscriptionsLoaded = true;
                render("subscriptions");
              }
            }
          }));
        }

        /**
         * Fetches usage data and token usage data from the specified API endpoint.
         */
        async function fetchData(page = 1) {
          state.isLoading = true;
          try {
            await fetchTokenUsageSummaryAndEvents(page);
          } finally {
            state.isLoading = false;
            render("usage");
          }
        }

        async function fetchTokenUsageSummaryAndEvents(page = 1) {
          invalidateSessionsRequest();
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageDailyError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageSummaryError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageEventsError = null;
            render();
            return;
          }

          const period = getSelectedPeriod();
          state.isTokenUsageLoading = true;
          state.tokenUsageDailySummary = null;
          state.tokenUsageSummary = null;
          state.tokenUsageEventsPage = null;
          state.tokenUsageDailyError = null;
          state.tokenUsageSummaryError = null;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            const [summaryResult, dailyResult, eventsResult] =
              await Promise.allSettled([
                fetchJson(buildTokenUsageSummaryUrl(usageUrl, period)),
                fetchJson(buildTokenUsageDailyUrl(usageUrl, period)),
                fetchJson(buildTokenUsageEventsUrl(usageUrl, period, page)),
              ]);

            if (summaryResult.status === "fulfilled") {
              state.tokenUsageSummary = summaryResult.value;
              void fetchTokenUsageSessionsPage(1);
            } else if (
              isMissingTokenUsageEndpointError(summaryResult.reason)
            ) {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = null;
            } else {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = getErrorMessage(
                summaryResult.reason
              );
            }

            if (dailyResult.status === "fulfilled") {
              state.tokenUsageDailySummary = dailyResult.value;
            } else if (
              isMissingTokenUsageEndpointError(dailyResult.reason)
            ) {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = null;
            } else {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = getErrorMessage(
                dailyResult.reason
              );
            }

            if (eventsResult.status === "fulfilled") {
              state.tokenUsageEventsPage = eventsResult.value;
            } else if (
              isMissingTokenUsageEndpointError(eventsResult.reason)
            ) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = getErrorMessage(
                eventsResult.reason
              );
            }
          } catch (error) {
            console.error("Token usage fetch error:", error);
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageDailyError = getErrorMessage(error);
            state.tokenUsageSummaryError = getErrorMessage(error);
            state.tokenUsageEventsError = getErrorMessage(error);
          } finally {
            state.isTokenUsageLoading = false;
            render("usage");
          }
        }

        async function fetchTokenUsageEventsPage(page) {
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.tokenUsageEventsError =
              "Token usage requires a valid endpoint URL.";
            render();
            return;
          }

          state.isEventsLoading = true;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            state.tokenUsageEventsPage = await fetchJson(
              buildTokenUsageEventsUrl(usageUrl, getSelectedPeriod(), page)
            );
          } catch (error) {
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              console.error("Token usage events fetch error:", error);
              state.tokenUsageEventsError = getErrorMessage(error);
            }
          } finally {
            state.isEventsLoading = false;
            render("usage");
          }
        }

        async function fetchTokenUsageSessionsPage(page) {
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            return;
          }

          const requestId = ++state.sessionsRequestId;
          state.isSessionsLoading = true;
          state.tokenUsageSessionsError = null;
          render();

          try {
            const result = await fetchJson(
              buildTokenUsageEventsUrl(
                resolveUsageUrl(endpoint),
                getSelectedPeriod(),
                page,
                "sessions"
              )
            );
            if (requestId !== state.sessionsRequestId) {
              return;
            }
            state.tokenUsageSessionsPage = result;
          } catch (error) {
            if (requestId !== state.sessionsRequestId) {
              return;
            }
            // Older servers have no sessions endpoint; show the empty state.
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageSessionsPage = null;
            } else {
              console.error("Token usage sessions fetch error:", error);
              state.tokenUsageSessionsError = getErrorMessage(error);
            }
          }

          state.isSessionsLoading = false;
          render("usage");
        }

        // Clears sessions when refreshing the endpoint or period and ignores
        // late responses from the previous context.
        function invalidateSessionsRequest() {
          state.sessionsRequestId += 1;
          state.isSessionsLoading = false;
          state.tokenUsageSessionsPage = null;
          state.tokenUsageSessionsError = null;
        }

        // --- Event Handlers & Initialization ---

        /**
         * Handles the form submission to trigger a data fetch.
         * @param {Event} event - The form submission event.
         */
        function handleFormSubmit(event) {
          event.preventDefault();
          syncEndpointCredential();
          storeApiKey(apiKeyInput.value, endpointUrlInput.value.trim());
          syncUrlState();
          if (state.activeTab === "models") {
            void fetchModels();
          } else if (state.activeTab === "subscriptions") {
            void refreshSubscriptionQuotas();
          } else {
            void fetchData();
          }
        }

        function handlePeriodChange() {
          syncUrlState();
          void fetchTokenUsageSummaryAndEvents(1);
        }

        function handleContentAreaClick(event) {
          if (!(event.target instanceof Element)) {
            return;
          }
          const quotaRefresh = event.target.closest("[data-quota-refresh]");
          if (quotaRefresh) {
            void refreshSubscriptionQuotas(quotaRefresh.dataset.quotaRefresh);
            return;
          }
          const copyButton = event.target.closest("[data-model-copy]");
          if (copyButton) {
            void copyModelId(copyButton.dataset.modelCopy);
            return;
          }
          const collapseToggle = event.target.closest("[data-collapse-toggle]");
          if (collapseToggle) {
            toggleCollapsedSection(collapseToggle);
            return;
          }
          const detailsButton = event.target.closest("[data-model-details]");
          if (detailsButton) {
            const details = document.getElementById(
              detailsButton.dataset.modelDetails
            );
            details.hidden = !details.hidden;
            detailsButton.setAttribute("aria-expanded", String(!details.hidden));
            detailsButton.textContent = details.hidden ? "View JSON" : "Hide JSON";
            return;
          }
          const trendMetric = event.target.closest("[data-trend-metric]");
          if (trendMetric) {
            state.tokenUsageTrendMetric =
              trendMetric.getAttribute("data-trend-metric")
              || ALL_METRICS_VALUE;
            render();
            return;
          }

          const trendPoint = event.target.closest("[data-trend-day]");
          if (trendPoint) {
            const day = trendPoint.getAttribute("data-trend-day");
            if (day) {
              state.tokenUsageTrendDay = day;
              render();
            }
            return;
          }

          const sessionButton = event.target.closest("[data-session-page]");
          if (sessionButton) {
            if (!state.isSessionsLoading) {
              // Offset 0 is the error retry button: reload the current page.
              void fetchTokenUsageSessionsPage(
                (state.tokenUsageSessionsPage?.page ?? 1)
                  + Number(sessionButton.getAttribute("data-session-page"))
              );
            }
            return;
          }

          const actionButton = event.target.closest("[data-page-action]");
          if (!actionButton || !state.tokenUsageEventsPage || state.isEventsLoading) {
            return;
          }

          const action = actionButton.getAttribute("data-page-action");
          if (
            action === "previous"
            && state.tokenUsageEventsPage.page > 1
          ) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page - 1);
          }

          if (
            action === "next"
            && state.tokenUsageEventsPage.page
              < state.tokenUsageEventsPage.total_pages
          ) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page + 1);
          }
        }

        function handleContentAreaChange(event) {
          if (!(event.target instanceof HTMLSelectElement)) {
            return;
          }

          if (!event.target.matches("[data-token-usage-trend-model]")) {
            return;
          }

          state.tokenUsageTrendModel =
            event.target.value || ALL_MODELS_VALUE;
          render();
        }

        let currentEndpointOrigin = "";

        function syncEndpointCredential() {
          const endpoint = endpointUrlInput.value.trim();
          const endpointOrigin = getEndpointOrigin(endpoint);
          if (endpointOrigin === currentEndpointOrigin) {
            return;
          }
          apiKeyInput.value = loadStoredApiKey(endpoint);
          currentEndpointOrigin = endpointOrigin;
        }

        /**
         * Initializes the application.
         */
        function init() {
          endpointForm.addEventListener("submit", handleFormSubmit);
          pageTabs.addEventListener("click", (event) => {
            const button = event.target.closest("[data-tab]");
            if (button) {
              activateTab(button.dataset.tab);
            }
          });
          pageTabs.addEventListener("keydown", handleTabsKeydown);
          tokenUsagePeriodSelect.addEventListener("change", handlePeriodChange);
          apiKeyInput.addEventListener("input", () => {
            storeApiKey(
              apiKeyInput.value,
              endpointUrlInput.value.trim()
            );
            handleModelsConnectionChange();
          });
          endpointUrlInput.addEventListener("input", handleModelsConnectionChange);
          endpointUrlInput.addEventListener("change", () => {
            syncEndpointCredential();
            handleModelsConnectionChange();
          });
          contentArea.addEventListener("click", handleContentAreaClick);
          contentArea.addEventListener("change", handleContentAreaChange);
          contentArea.addEventListener("input", handleModelsSearch);

          const urlParams = new URLSearchParams(window.location.search);
          const periodFromUrl = normalizePeriod(urlParams.get("period"));
          const endpointFromUrl = urlParams.get("endpoint");
          const initialEndpoint = endpointFromUrl || DEFAULT_ENDPOINT;

          const initialTab = urlParams.get("tab");
          if (["usage", "subscriptions", "models"].includes(initialTab)) state.activeTab = initialTab;
          state.tokenUsagePeriod = periodFromUrl;
          tokenUsagePeriodSelect.value = periodFromUrl;
          endpointUrlInput.value = initialEndpoint;
          migrateLegacyApiKey(initialEndpoint);
          syncEndpointCredential();
          state.collapsedSections = readCollapsedSections();

          if (endpointFromUrl) {
            if (state.activeTab === "subscriptions") void refreshSubscriptionQuotas();
            else if (state.activeTab === "models") void fetchModels();
            else void fetchData();
          } else {
            render();
          }
        }

        // Start the app
        init();
      });
    </script>

  </body>
</html>
