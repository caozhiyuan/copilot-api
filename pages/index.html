<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot API Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://github.githubassets.com/favicons/favicon.svg"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.6/index.css"
      rel="stylesheet"
    />

    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("copilot-api.usage-viewer.theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"></script>

    <style>
      :root {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #fafafa;
        --card: #0c0c0f;
        --card-foreground: #fafafa;
        --popover: #0c0c0f;
        --popover-foreground: #fafafa;
        --primary: #fafafa;
        --primary-foreground: #18181b;
        --secondary: #18181b;
        --secondary-foreground: #f4f4f5;
        --muted: #18181b;
        --muted-foreground: #a1a1aa;
        --accent: #27272a;
        --accent-foreground: #fafafa;
        --destructive: #ef4444;
        --destructive-foreground: #fef2f2;
        --destructive-muted: rgba(239, 68, 68, 0.1);
        --destructive-border: rgba(239, 68, 68, 0.28);
        --border: #27272a;
        --input: #27272a;
        --ring: #a1a1aa;
        --surface-raised: #111114;
        --surface-hover: #18181b;
        --surface-subtle: #101012;
        --shadow: rgba(0, 0, 0, 0.24);
        --overlay: rgba(9, 9, 11, 0.72);
        --chart-grid: #27272a;
        --chart-muted: #71717a;
        --chart-1: #60a5fa;
        --chart-2: #4ade80;
        --chart-3: #fbbf24;
        --chart-4: #c084fc;
        --chart-5: #22d3ee;
        --success: #4ade80;
        --warning: #fbbf24;
        --info: #60a5fa;
        --info-muted: rgba(96, 165, 250, 0.1);
        --info-border: rgba(96, 165, 250, 0.28);
        --radius: 6px;

        /* Compatibility aliases used by the existing render functions. */
        --color-red: var(--destructive);
        --color-green: var(--success);
        --color-yellow: var(--warning);
        --color-blue: var(--info);
        --color-purple: var(--chart-4);
        --color-aqua: var(--chart-5);
        --color-orange: #fb923c;
        --color-gray: var(--muted-foreground);
        --color-red-accent: var(--destructive);
        --color-green-accent: var(--chart-2);
        --color-yellow-accent: var(--chart-3);
        --color-blue-accent: var(--chart-1);
        --color-purple-accent: var(--chart-4);
        --color-aqua-accent: var(--chart-5);
        --color-orange-accent: #fb923c;
        --color-gray-accent: var(--chart-muted);
        --color-bg-darkest: var(--background);
        --color-bg: var(--card);
        --color-bg-light-1: var(--surface-subtle);
        --color-bg-light-2: var(--border);
        --color-bg-light-3: #3f3f46;
        --color-bg-light-4: var(--chart-muted);
        --color-bg-soft: var(--muted);
        --color-fg-darker: var(--muted-foreground);
        --color-fg-dark: #d4d4d8;
        --color-fg-medium: #e4e4e7;
        --color-fg-light: var(--foreground);
        --color-fg-lightest: var(--foreground);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background: #fafafa;
        --foreground: #18181b;
        --card: #ffffff;
        --card-foreground: #18181b;
        --popover: #ffffff;
        --popover-foreground: #18181b;
        --primary: #18181b;
        --primary-foreground: #fafafa;
        --secondary: #f4f4f5;
        --secondary-foreground: #27272a;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --accent: #e4e4e7;
        --accent-foreground: #18181b;
        --destructive: #dc2626;
        --destructive-foreground: #7f1d1d;
        --destructive-muted: rgba(220, 38, 38, 0.07);
        --destructive-border: rgba(220, 38, 38, 0.22);
        --border: #e4e4e7;
        --input: #d4d4d8;
        --ring: #71717a;
        --surface-raised: #ffffff;
        --surface-hover: #f4f4f5;
        --surface-subtle: #fafafa;
        --shadow: rgba(24, 24, 27, 0.06);
        --overlay: rgba(255, 255, 255, 0.76);
        --chart-grid: #e4e4e7;
        --chart-muted: #a1a1aa;
        --chart-1: #2563eb;
        --chart-2: #16a34a;
        --chart-3: #d97706;
        --chart-4: #7c3aed;
        --chart-5: #0891b2;
        --success: #16a34a;
        --warning: #d97706;
        --info: #2563eb;
        --info-muted: rgba(37, 99, 235, 0.08);
        --info-border: rgba(37, 99, 235, 0.22);
        --color-bg-light-3: #d4d4d8;
        --color-fg-dark: #52525b;
        --color-fg-medium: #3f3f46;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        margin: 0;
        font-family:
          "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        background: var(--background);
        color: var(--foreground);
        transition:
          background-color 0.18s ease,
          color 0.18s ease;
      }

      .app-shell {
        min-height: 100vh;
        background: var(--background);
      }

      .main-shell {
        min-width: 0;
        padding: 40px 48px 56px;
      }

      .topbar {
        margin: 0 auto 32px;
        max-width: 1720px;
      }

      .topbar-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--muted-foreground);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .config-toggle {
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .config-chevron {
        transition: transform 0.22s ease;
      }

      .config-toggle[aria-expanded="true"] .config-chevron {
        transform: rotate(180deg);
      }

      .config-toggle:hover {
        border-color: var(--ring);
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .theme-toggle:hover {
        border-color: var(--ring);
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .theme-toggle:active,
      .primary-action:active,
      .pill-button:active {
        transform: translateY(1px);
      }

      .page-title {
        margin: 0;
        max-width: 920px;
        font-size: clamp(30px, 3vw, 42px);
        font-weight: 650;
        line-height: 1.1;
        letter-spacing: 0.025em;
        color: var(--color-fg-lightest);
      }

      .brand-heading {
        min-width: 0;
      }

      .title-line {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        filter: invert(1);
      }

      :root[data-theme="light"] .brand-logo {
        filter: none;
      }

      .page-kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        color: var(--color-blue);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .page-kicker::before {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--success);
        box-shadow: 0 0 0 3px
          color-mix(in srgb, var(--success) 14%, transparent);
        content: "";
      }

      .page-subtitle {
        max-width: 720px;
        margin: 10px 0 0;
        color: var(--color-gray);
        font-size: 13px;
        line-height: 1.65;
      }

      .control-surface {
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(220px, 360px);
        gap: 16px;
        align-items: end;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        background: var(--card);
        box-shadow: 0 1px 2px var(--shadow);
        max-height: 520px;
        opacity: 1;
        overflow: hidden;
        transform: translateY(0);
        transition:
          max-height 0.28s ease,
          padding 0.28s ease,
          border-color 0.2s ease,
          opacity 0.2s ease,
          transform 0.28s ease;
      }

      .control-surface.is-collapsed {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-color: transparent;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
      }

      .control-surface:not(.is-collapsed) {
        margin-bottom: 12px;
      }

      .report-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 8px 10px 8px 14px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        background: var(--card);
        box-shadow: none;
      }

      .report-premium-row {
        display: grid;
        grid-template-columns: minmax(420px, 1.2fr) minmax(320px, 0.8fr);
        gap: 12px;
        align-items: stretch;
      }

      .report-premium-row:has(#premium-toolbar-slot:empty) {
        grid-template-columns: 1fr;
      }

      #premium-toolbar-slot {
        display: flex;
        min-width: 0;
      }

      #premium-toolbar-slot:empty {
        display: none;
      }

      .premium-toolbar {
        display: flex;
        width: 100%;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        background: var(--card);
      }

      .premium-toolbar-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        font-size: 11px;
      }

      .premium-toolbar-title {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--foreground);
        font-weight: 650;
      }

      .premium-toolbar-meta {
        color: var(--muted-foreground);
        white-space: nowrap;
      }

      .report-toolbar-title {
        margin: 0;
        color: var(--foreground);
        font-size: 13px;
        font-weight: 650;
      }

      .report-toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .period-control {
        width: 150px;
      }

      .report-toolbar .select-control,
      .report-toolbar .primary-action {
        height: 36px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--color-fg-medium);
        font-size: 12px;
        font-weight: 700;
      }

      .input-control,
      .select-control {
        width: 100%;
        height: 42px;
        border: 1px solid var(--color-bg-light-3);
        border-radius: var(--radius);
        background: var(--surface-subtle);
        color: var(--color-fg-lightest);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.16s ease;
      }

      .input-control {
        padding: 0 14px;
      }

      .select-control {
        appearance: none;
        padding: 0 46px 0 14px;
        cursor: pointer;
      }

      .select-shell {
        position: relative;
      }

      .select-shell > svg,
      .select-shell > i {
        position: absolute;
        top: 50%;
        right: 16px;
        width: 16px;
        height: 16px;
        color: var(--muted-foreground);
        pointer-events: none;
        transform: translateY(-50%);
      }

      .input-control::placeholder {
        color: var(--muted-foreground);
      }

      .input-control:hover,
      .select-control:hover {
        border-color: var(--ring);
        background: var(--surface-hover);
      }

      .primary-action {
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 120px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 14px;
        font-weight: 700;
        transition:
          background-color 0.16s ease,
          transform 0.16s ease;
      }

      .primary-action:hover {
        opacity: 0.88;
      }

      .content-area {
        max-width: 1720px;
        margin: 0 auto;
      }

      .dashboard-section {
        margin-bottom: 32px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--color-fg-lightest);
        font-size: 16px;
        font-weight: 750;
        letter-spacing: 0.015em;
      }

      .section-subtitle {
        margin-top: -6px;
        margin-bottom: 16px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .range-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 2px;
        padding: 6px 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-subtle);
        color: var(--color-fg-dark);
      }

      .token-usage-heading {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .token-usage-heading .section-heading,
      .token-usage-heading .range-label {
        margin: 0;
      }

      .panel {
        border: 1px solid var(--color-bg-light-2);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: 0 1px 2px var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .panel-title {
        color: var(--color-fg-lightest);
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.012em;
      }

      .panel-meta {
        margin-top: 2px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
      }

      .metric-grid-tight {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .quota-standard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .quota-card-wide {
        min-height: 0;
        padding: 12px 16px;
        background: var(--surface-raised);
      }

      .quota-card-wide .progress-bar-bg,
      .quota-card-wide .progress-bar-fg {
        height: 6px;
      }

      .quota-card-wide .mt-5 {
        margin-top: 10px;
      }

      .quota-card-wide .mt-2 {
        margin-top: 6px;
      }

      .metric-card {
        min-height: 88px;
        padding: 16px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: 0 1px 2px var(--shadow);
      }

      .metric-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-fg-medium);
        font-size: 13px;
        font-weight: 650;
      }

      .metric-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .metric-value {
        margin-top: 10px;
        color: var(--color-fg-lightest);
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 800;
        line-height: 1.1;
      }

      .metric-note {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .progress-bar-bg {
        background-color: var(--color-bg-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar-fg {
        border-radius: 999px;
        transition: width 0.5s ease-in-out;
      }

      .code-block::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .code-block::-webkit-scrollbar-track {
        background: var(--color-bg-light-1);
      }

      .code-block::-webkit-scrollbar-thumb {
        background: var(--color-bg-light-3);
        border-radius: 999px;
      }

      .code-block::-webkit-scrollbar-thumb:hover {
        background: var(--color-bg-light-4);
      }

      .input-focus:focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 24%, transparent);
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .data-table thead {
        background: var(--color-bg-light-1);
        color: var(--color-fg-medium);
      }

      .data-table tbody tr {
        transition: background-color 0.12s ease;
      }

      .data-table tbody tr:hover {
        background: var(--surface-hover);
      }

      .data-table th {
        font-size: 12px;
        font-weight: 750;
      }

      .data-table td {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .pill-button {
        border: 1px solid var(--color-bg-light-2);
        border-radius: var(--radius);
        background: var(--color-bg);
        color: var(--color-fg-medium);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease;
      }

      .pill-button:hover:not(:disabled) {
        border-color: var(--ring);
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .code-block {
        background: var(--surface-subtle);
        color: var(--card-foreground);
      }

      .animate-pulse,
      .opacity-60 {
        color: var(--muted-foreground);
      }

      [role="alert"] {
        background: var(--destructive-muted) !important;
        border-color: var(--destructive-border) !important;
        color: var(--destructive) !important;
      }

      .quick-state-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .insights-block {
        margin-top: 24px;
      }

      .insight-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }

      .insight-card {
        min-height: 96px;
      }

      .insight-value {
        margin-top: 9px;
        color: var(--foreground);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .context-strip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin-bottom: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-subtle);
        color: var(--muted-foreground);
        font-size: 11px;
      }

      .context-strip strong {
        color: var(--foreground);
        font-weight: 650;
      }

      .insight-note {
        margin-top: 12px;
        padding: 10px 12px;
        border-left: 2px solid var(--warning);
        background: var(--surface-subtle);
        color: var(--color-fg-dark);
        font-size: 11px;
        line-height: 1.55;
      }

      .trend-chart-wrap {
        position: relative;
      }

      .trend-tooltip {
        position: absolute;
        z-index: 2;
        top: 12px;
        left: clamp(104px, var(--tooltip-x), calc(100% - 104px));
        min-width: 168px;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--popover);
        box-shadow: 0 10px 28px var(--shadow);
        color: var(--popover-foreground);
        pointer-events: none;
        transform: translateX(-50%);
      }

      .trend-tooltip-date {
        margin-bottom: 6px;
        color: var(--foreground);
        font-size: 11px;
        font-weight: 700;
      }

      .trend-tooltip-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        color: var(--muted-foreground);
        font-size: 10px;
        line-height: 1.65;
      }

      .trend-tooltip-row strong {
        color: var(--foreground);
        font-weight: 650;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (max-width: 1280px) {
        .metric-grid-tight {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 1100px) {
        .main-shell {
          padding: 32px 28px 44px;
        }

        .control-surface {
          grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
        }
      }

      @media (max-width: 640px) {
        .main-shell {
          padding: 24px 18px 36px;
        }

        .control-surface {
          grid-template-columns: 1fr;
        }

        .endpoint-field {
          grid-column: auto;
        }

        .metric-grid-tight {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .quota-standard-grid {
          grid-template-columns: 1fr;
        }

        .control-surface {
          padding: 16px;
        }

        .page-title {
          font-size: 30px;
        }

        .title-line {
          gap: 10px;
        }

        .brand-logo {
          width: 30px;
          height: 30px;
        }

        .config-toggle span {
          display: none;
        }

        .report-toolbar {
          align-items: stretch;
          flex-direction: column;
          gap: 14px;
        }

        .report-premium-row {
          grid-template-columns: 1fr;
        }

        .report-toolbar-actions {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .period-control {
          width: auto;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="app" class="app-shell">
      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-row">
            <div class="brand-heading">
              <p class="page-kicker">Usage analytics</p>
              <div class="title-line">
                <img
                  class="brand-logo"
                  src="https://cdn.simpleicons.org/github/18181b"
                  alt="GitHub"
                  width="36"
                  height="36"
                />
                <h1 class="page-title">Copilot API Dashboard</h1>
              </div>
              <p class="page-subtitle">
                Monitor quota health, token consumption, estimated cost, and
                request activity.
              </p>
            </div>
            <div class="topbar-actions">
              <button
                id="config-toggle"
                class="config-toggle"
                type="button"
                aria-controls="endpoint-config"
                aria-expanded="false"
                title="Show endpoint configuration"
              >
                <span>Setup</span>
                <i
                  data-lucide="chevron-down"
                  class="config-chevron h-4 w-4"
                ></i>
              </button>
              <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Switch to light theme"
                title="Switch to light theme"
              >
                <i data-lucide="sun" class="h-4 w-4"></i>
              </button>
            </div>
          </div>

          <form id="endpoint-form">
            <div id="endpoint-config" class="control-surface is-collapsed">
              <div class="endpoint-field">
                <label for="endpoint-url" class="field-label"
                  >Usage Endpoint URL</label
                >
                <input
                  type="text"
                  id="endpoint-url"
                  class="input-control input-focus"
                  placeholder="http://localhost:4141/usage"
                />
              </div>
              <div>
                <label for="x-api-key" class="field-label">x-api-key</label>
                <input
                  type="password"
                  id="x-api-key"
                  class="input-control input-focus"
                  placeholder="Optional when auth is enabled"
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>
            </div>

            <div class="report-premium-row">
              <div id="premium-toolbar-slot"></div>
              <div class="report-toolbar">
                <p class="report-toolbar-title">Usage report</p>
                <div class="report-toolbar-actions">
                  <div class="period-control">
                    <label for="token-usage-period" class="sr-only"
                      >Period</label
                    >
                    <div class="select-shell">
                      <select
                        id="token-usage-period"
                        class="select-control input-focus"
                      >
                        <option value="day">Day</option>
                        <option value="week">Week</option>
                        <option value="month">Month</option>
                      </select>
                      <i data-lucide="chevron-down" aria-hidden="true"></i>
                    </div>
                  </div>
                  <button
                    id="fetch-button"
                    type="submit"
                    class="primary-action"
                  >
                    <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                    <span>Refresh</span>
                  </button>
                </div>
              </div>
            </div>
          </form>
        </header>

        <main id="content-area" class="content-area"></main>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const endpointForm = document.getElementById("endpoint-form");
        const endpointConfig = document.getElementById("endpoint-config");
        const endpointUrlInput = document.getElementById("endpoint-url");
        const apiKeyInput = document.getElementById("x-api-key");
        const tokenUsagePeriodSelect =
          document.getElementById("token-usage-period");
        const contentArea = document.getElementById("content-area");
        const premiumToolbarSlot = document.getElementById(
          "premium-toolbar-slot",
        );
        const fetchButton = document.getElementById("fetch-button");
        const fetchButtonLabel = fetchButton.querySelector("span");
        const configToggle = document.getElementById("config-toggle");
        const themeToggle = document.getElementById("theme-toggle");

        const DEFAULT_ENDPOINT = "http://localhost:4141/usage";
        const DEFAULT_TOKEN_USAGE_PERIOD = "month";
        const DEFAULT_TOKEN_USAGE_EVENTS_PAGE_SIZE = 100;
        const ALL_METRICS_VALUE = "__all__";
        const ALL_MODELS_VALUE = "__all__";
        const API_KEY_STORAGE_KEY = "copilot-api.usage-viewer.x-api-key";
        const THEME_STORAGE_KEY = "copilot-api.usage-viewer.theme";
        const VALID_PERIODS = new Set(["day", "week", "month"]);
        const EMPTY_TOKEN_USAGE_TOTALS = {
          cache_creation_input_tokens: 0,
          cache_read_input_tokens: 0,
          costs: [],
          input_tokens: 0,
          output_tokens: 0,
          request_count: 0,
          total_nano_aiu: null,
          total_tokens: 0,
        };

        // --- State Management ---
        const state = {
          isLoading: false,
          isTokenUsageLoading: false,
          isEventsLoading: false,
          error: null,
          data: null,
          tokenUsageDailySummary: null,
          tokenUsageSummary: null,
          tokenUsageEventsPage: null,
          tokenUsageDailyError: null,
          tokenUsageSummaryError: null,
          tokenUsageEventsError: null,
          tokenUsagePeriod: DEFAULT_TOKEN_USAGE_PERIOD,
          tokenUsageTrendDayIndex: null,
          tokenUsageTrendMetric: ALL_METRICS_VALUE,
          tokenUsageTrendModel: ALL_MODELS_VALUE,
        };

        // --- Rendering Logic ---

        /**
         * Safely calls lucide.createIcons() if the library is available.
         */
        function createIcons() {
          if (typeof lucide !== "undefined") {
            lucide.createIcons();
          }
        }

        function getCurrentTheme() {
          return document.documentElement.dataset.theme === "light"
            ? "light"
            : "dark";
        }

        function applyTheme(theme, persist = true) {
          const normalizedTheme = theme === "light" ? "light" : "dark";
          const nextTheme = normalizedTheme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = normalizedTheme;
          themeToggle.setAttribute(
            "aria-label",
            `Switch to ${nextTheme} theme`,
          );
          themeToggle.title = `Switch to ${nextTheme} theme`;
          themeToggle.innerHTML = `<i data-lucide="${
            normalizedTheme === "dark" ? "sun" : "moon"
          }" class="h-4 w-4"></i>`;

          if (persist) {
            try {
              localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
            } catch (error) {
              console.warn(
                "Could not store theme preference:",
                getErrorMessage(error),
              );
            }
          }

          createIcons();
        }

        function handleThemeToggle() {
          applyTheme(getCurrentTheme() === "dark" ? "light" : "dark");
        }

        function handleConfigToggle() {
          const willShow = endpointConfig.classList.contains("is-collapsed");
          endpointConfig.classList.toggle("is-collapsed", !willShow);
          configToggle.setAttribute("aria-expanded", String(willShow));
          configToggle.title = willShow
            ? "Hide endpoint configuration"
            : "Show endpoint configuration";
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function getErrorMessage(error) {
          if (error instanceof Error) {
            return error.message;
          }
          return typeof error === "string" ? error : "Unknown error.";
        }

        function isMissingTokenUsageEndpointError(error) {
          return Boolean(
            error &&
              typeof error === "object" &&
              "status" in error &&
              error.status === 404,
          );
        }

        function normalizePeriod(value) {
          return VALID_PERIODS.has(value) ? value : DEFAULT_TOKEN_USAGE_PERIOD;
        }

        function getSelectedPeriod() {
          const normalized = normalizePeriod(tokenUsagePeriodSelect.value);
          tokenUsagePeriodSelect.value = normalized;
          state.tokenUsagePeriod = normalized;
          return normalized;
        }

        function loadStoredApiKey() {
          try {
            return localStorage.getItem(API_KEY_STORAGE_KEY) || "";
          } catch (error) {
            console.warn(
              "Could not read stored API key:",
              getErrorMessage(error),
            );
            return "";
          }
        }

        function storeApiKey(value) {
          try {
            const trimmed = value.trim();
            if (trimmed) {
              localStorage.setItem(API_KEY_STORAGE_KEY, trimmed);
            } else {
              localStorage.removeItem(API_KEY_STORAGE_KEY);
            }
          } catch (error) {
            console.warn("Could not store API key:", getErrorMessage(error));
          }
        }

        function buildRequestHeaders() {
          const headers = {};
          const apiKey = apiKeyInput.value.trim();
          if (apiKey) {
            headers["x-api-key"] = apiKey;
          }
          return headers;
        }

        function resolveUsageUrl(endpoint) {
          return new URL(endpoint, window.location.href).toString();
        }

        function deriveEndpointUrl(usageEndpoint, targetPath) {
          const url = new URL(usageEndpoint, window.location.href);
          const normalizedTargetPath = targetPath.replace(/^\/+/, "");
          const normalizedPath = url.pathname.replace(/\/+$/, "");
          const nextPath = normalizedPath.endsWith("/usage")
            ? normalizedPath.replace(/\/usage$/, `/${normalizedTargetPath}`)
            : `${normalizedPath || ""}/${normalizedTargetPath}`;

          url.pathname = nextPath.startsWith("/") ? nextPath : `/${nextPath}`;
          url.search = "";
          url.hash = "";
          return url.toString();
        }

        function buildTokenUsageSummaryUrl(usageEndpoint, period) {
          const url = new URL(deriveEndpointUrl(usageEndpoint, "token-usage"));
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageDailyUrl(usageEndpoint, period) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, "token-usage/daily"),
          );
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageEventsUrl(usageEndpoint, period, page) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, "token-usage/events"),
          );
          url.searchParams.set("period", period);
          url.searchParams.set("page", String(page));
          url.searchParams.set(
            "page_size",
            String(DEFAULT_TOKEN_USAGE_EVENTS_PAGE_SIZE),
          );
          return url.toString();
        }

        async function fetchJson(url) {
          const response = await fetch(url, {
            headers: buildRequestHeaders(),
          });

          if (!response.ok) {
            let message = response.statusText || "Request failed";

            try {
              const contentType = response.headers.get("content-type") || "";
              if (contentType.includes("application/json")) {
                const payload = await response.json();
                const apiMessage = payload?.error?.message || payload?.message;
                if (typeof apiMessage === "string" && apiMessage.trim()) {
                  message = apiMessage.trim();
                }
              } else {
                const text = await response.text();
                if (text.trim()) {
                  message = text.trim();
                }
              }
            } catch (error) {
              console.warn(
                "Could not parse error response:",
                getErrorMessage(error),
              );
            }

            const error = new Error(
              `Request failed with status ${response.status}: ${message}`,
            );
            error.status = response.status;
            throw error;
          }

          return response.json();
        }

        function syncUrlState() {
          try {
            const currentUrl = new URL(window.location.href);
            const endpoint = endpointUrlInput.value.trim();
            const period = getSelectedPeriod();

            if (endpoint) {
              currentUrl.searchParams.set("endpoint", endpoint);
            } else {
              currentUrl.searchParams.delete("endpoint");
            }

            currentUrl.searchParams.set("period", period);
            window.history.pushState({}, "", currentUrl);
          } catch (error) {
            console.warn("Could not update URL:", getErrorMessage(error));
          }
        }

        function updateControls() {
          fetchButton.disabled = state.isLoading;
          fetchButtonLabel.textContent = state.isLoading
            ? "Refreshing..."
            : "Refresh";
          tokenUsagePeriodSelect.disabled =
            state.isLoading || state.isTokenUsageLoading;
        }

        function formatNumber(value) {
          return Number.isFinite(value) ? Number(value).toLocaleString() : "0";
        }

        function formatCurrencyAmount(currency, amount) {
          const symbols = {
            CNY: "¥",
            USD: "$",
          };
          const normalizedCurrency =
            typeof currency === "string" && currency.trim()
              ? currency.trim().toUpperCase()
              : "";
          const symbol = symbols[normalizedCurrency] || "";
          return symbol
            ? `${symbol}${Number(amount).toFixed(6)}`
            : `${normalizedCurrency} ${Number(amount).toFixed(6)}`;
        }

        function getCostAmount(cost) {
          if (Number.isFinite(cost?.amount)) {
            return Number(cost.amount);
          }
          if (Number.isFinite(cost?.total_cost_nanos)) {
            return Number(cost.total_cost_nanos) / 1_000_000_000;
          }
          return null;
        }

        function formatTokenUsageCost(cost) {
          const amount = getCostAmount(cost);
          return amount === null || !cost?.currency
            ? "—"
            : formatCurrencyAmount(cost.currency, amount);
        }

        function formatTokenUsageCosts(costs) {
          if (!Array.isArray(costs) || costs.length === 0) {
            return ["—"];
          }
          return costs.map((cost) => formatTokenUsageCost(cost));
        }

        function formatDateTime(value) {
          if (!Number.isFinite(value)) {
            return "N/A";
          }
          return new Date(value).toLocaleString();
        }

        function formatCellText(value) {
          if (typeof value !== "string") {
            return "—";
          }

          const trimmed = value.trim();
          return trimmed || "—";
        }

        function formatRangeDate(value) {
          if (!Number.isFinite(value)) {
            return "N/A";
          }

          return new Date(value).toLocaleDateString(undefined, {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        }

        function renderTokenUsageRangeText(period, range) {
          const labels = {
            day: "Day",
            week: "Week",
            month: "Month",
          };

          if (!range) {
            return `${labels[period] || labels.day} range unavailable`;
          }

          const inclusiveEnd = Math.max(range.start_ms, range.end_ms - 1);
          return `${labels[period] || labels.day} · ${formatRangeDate(
            range.start_ms,
          )} – ${formatRangeDate(inclusiveEnd)}`;
        }

        function aggregateTokenUsageRows(rows) {
          const totals = {
            ...EMPTY_TOKEN_USAGE_TOTALS,
            costs: [],
          };
          const costsByCurrency = new Map();
          let hasAiu = false;

          rows.forEach((row) => {
            totals.cache_creation_input_tokens +=
              row.cache_creation_input_tokens || 0;
            totals.cache_read_input_tokens += row.cache_read_input_tokens || 0;
            totals.input_tokens += row.input_tokens || 0;
            totals.output_tokens += row.output_tokens || 0;
            totals.request_count += row.request_count || 0;
            totals.total_tokens += row.total_tokens || 0;
            if (Number.isFinite(row.total_nano_aiu)) {
              totals.total_nano_aiu =
                (totals.total_nano_aiu || 0) + row.total_nano_aiu;
              hasAiu = true;
            }
            (row.costs || []).forEach((cost) => {
              const currency = cost.currency || "";
              const current = costsByCurrency.get(currency) || {
                amount: 0,
                currency,
                total_cost_nanos: 0,
              };
              current.amount += getCostAmount(cost) || 0;
              current.total_cost_nanos += cost.total_cost_nanos || 0;
              costsByCurrency.set(currency, current);
            });
          });

          totals.total_nano_aiu = hasAiu ? totals.total_nano_aiu : null;
          totals.costs = [...costsByCurrency.values()];
          return totals;
        }

        function getDisplayedMonthData(dailySummary) {
          if (state.tokenUsagePeriod !== "month" || !dailySummary) {
            return dailySummary;
          }

          const now = new Date();
          const start = new Date(now.getFullYear(), now.getMonth(), 1);
          const end = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() + 1,
          );
          const days = (dailySummary.days || []).filter(
            (day) => day.start_ms >= start.getTime() && day.start_ms < end,
          );
          const modelRows = new Map();
          days.forEach((day) => {
            (day.byModel || []).forEach((model) => {
              const rows = modelRows.get(model.model) || [];
              rows.push(model);
              modelRows.set(model.model, rows);
            });
          });
          const byModel = [...modelRows.entries()]
            .map(([model, rows]) => ({
              ...aggregateTokenUsageRows(rows),
              model,
            }))
            .sort((left, right) => right.total_tokens - left.total_tokens);

          return {
            ...dailySummary,
            byModel,
            days,
            range: {
              end_ms: end.getTime(),
              end_utc: end.toISOString(),
              start_ms: start.getTime(),
              start_utc: start.toISOString(),
            },
            totals: aggregateTokenUsageRows(days.map((day) => day.totals)),
          };
        }

        /**
         * Renders the entire UI based on the current state.
         */
        function render() {
          updateControls();
          premiumToolbarSlot.innerHTML = renderPremiumQuota(
            state.data?.quota_snapshots,
          );

          if (state.isLoading) {
            contentArea.innerHTML = renderSpinner();
            createIcons();
            return;
          }

          const hasContent = Boolean(
            state.error ||
              state.data ||
              state.isTokenUsageLoading ||
              state.isEventsLoading ||
              state.tokenUsageDailySummary ||
              state.tokenUsageSummary ||
              state.tokenUsageEventsPage ||
              state.tokenUsageDailyError ||
              state.tokenUsageSummaryError ||
              state.tokenUsageEventsError,
          );

          if (!hasContent) {
            contentArea.innerHTML = renderWelcomeMessage();
          } else if (state.error && !state.data) {
            contentArea.innerHTML = `
              ${renderUsageErrorSection()}
              ${renderTokenUsageSection()}
            `;
          } else if (state.data) {
            contentArea.innerHTML = `
              ${renderTokenUsageSection()}
              ${renderChatQuotas(state.data.quota_snapshots)}
              ${renderDetailedData(state.data)}
            `;
          } else {
            contentArea.innerHTML = renderTokenUsageSection();
          }

          // Replace placeholder icons with actual Lucide icons
          createIcons();
        }

        /**
         * Renders the premium interactions quota near the top of the page.
         * @param {object} snapshots - The quota_snapshots object from the API response.
         * @returns {string} HTML string for the premium quota section.
         */
        function renderPremiumQuota(snapshots) {
          const premiumQuota = snapshots?.premium_interactions;
          if (!premiumQuota) return "";

          const { entitlement, remaining, percent_remaining, unlimited } =
            premiumQuota;
          const percentUsed = unlimited ? 0 : 100 - percent_remaining;
          const used = unlimited ? "N/A" : entitlement - remaining;
          let progressBarColor = "var(--color-green)";
          if (percentUsed > 75) progressBarColor = "var(--color-yellow)";
          if (percentUsed > 90) progressBarColor = "var(--color-red)";
          if (unlimited) progressBarColor = "var(--color-blue)";

          return `
            <section id="premium-quota" class="premium-toolbar">
              <div class="premium-toolbar-topline">
                <span class="premium-toolbar-title">
                  <i data-lucide="crown" class="h-4 w-4" style="color: var(--color-yellow);"></i>
                  <span>Copilot Premium Quota</span>
                </span>
                <span class="premium-toolbar-meta">
                  ${used.toLocaleString()} / ${unlimited ? "∞" : entitlement.toLocaleString()} · ${unlimited ? "Unlimited" : `${remaining.toLocaleString()} remaining`}
                </span>
              </div>
              <div class="progress-bar-bg h-1.5">
                <div
                  class="progress-bar-fg h-1.5"
                  style="width: ${unlimited ? 100 : percentUsed}%; background-color: ${progressBarColor};"
                ></div>
              </div>
            </section>
          `;
        }

        /**
         * Renders chat and completions quotas near the raw API response.
         * @param {object} snapshots - The quota_snapshots object from the API response.
         * @returns {string} HTML string for the chat quota section.
         */
        function renderChatQuotas(snapshots) {
          if (!snapshots) return "";

          const quotaCards = Object.entries(snapshots)
            .filter(([key]) => key !== "premium_interactions")
            .map(([key, value]) => renderQuotaCard(key, value))
            .join("");

          if (!quotaCards) return "";

          return `
            <section id="chat-quotas" class="dashboard-section">
              <h2 class="section-heading">
                <i data-lucide="messages-square" class="h-5 w-5" style="color: var(--color-blue);"></i>
                <span>Copilot Chat Quotas</span>
              </h2>
              <p class="section-subtitle">Chat and completions entitlement usage.</p>
              <div class="metric-grid quota-standard-grid">
                ${quotaCards}
              </div>
            </section>
          `;
        }

        function renderUsageErrorSection() {
          if (!state.error || state.data) {
            return "";
          }

          return `
            <section id="usage-quotas" class="dashboard-section">
              <h2 class="section-heading">
                <i data-lucide="gauge" class="h-5 w-5" style="color: var(--color-blue);"></i>
                <span>Copilot Chat Quotas</span>
              </h2>
              ${renderError(state.error, "Usage request failed")}
            </section>
          `;
        }

        /**
         * Renders a single quota card.
         * @param {string} title - The name of the quota (e.g., 'chat').
         * @param {object} details - The details object for the quota.
         * @param {string} className - Optional presentation class.
         * @returns {string} HTML string for a single card.
         */
        function renderQuotaCard(title, details, className = "") {
          const { entitlement, remaining, percent_remaining, unlimited } =
            details;

          const percentUsed = unlimited ? 0 : 100 - percent_remaining;
          const used = unlimited
            ? "N/A"
            : (entitlement - remaining).toLocaleString();

          let progressBarColor = "var(--color-green)";
          if (percentUsed > 75) progressBarColor = "var(--color-yellow)";
          if (percentUsed > 90) progressBarColor = "var(--color-red)";
          if (unlimited) progressBarColor = "var(--color-blue)";

          return `
            <div class="metric-card ${className}">
              <div class="flex items-center justify-between gap-3">
                <div class="metric-label capitalize">
                  <span class="metric-dot" style="background-color: ${progressBarColor};"></span>
                  <span>${escapeHtml(title.replace(/_/g, " "))}</span>
                </div>
                ${
                  unlimited
                    ? `<span class="rounded-md px-2 py-1 text-xs font-semibold" style="background-color: var(--info-muted); color: var(--color-blue);">Unlimited</span>`
                    : `<span class="text-xs font-semibold" style="color: var(--color-gray);">${percentUsed.toFixed(1)}% used</span>`
                }
              </div>
              <div class="mt-5">
                <div class="w-full progress-bar-bg h-2">
                  <div class="progress-bar-fg h-2" style="width: ${unlimited ? 100 : percentUsed}%; background-color: ${progressBarColor};"></div>
                </div>
              </div>
              <div class="mt-2 flex items-center justify-between gap-4 text-xs font-medium" style="color: var(--color-gray);">
                <span>${used} / ${unlimited ? "∞" : entitlement.toLocaleString()}</span>
                <span>${unlimited ? "∞" : remaining.toLocaleString()} remaining</span>
              </div>
            </div>
          `;
        }

        /**
         * Recursively builds a formatted HTML list from a JSON object.
         * @param {object} obj - The object to format.
         * @returns {string} HTML string for the formatted list.
         */
        function formatObject(obj) {
          if (obj === null || typeof obj !== "object") {
            return `<span style="color: var(--color-green);">${escapeHtml(JSON.stringify(obj))}</span>`;
          }

          return (
            '<div class="pl-4">' +
            Object.entries(obj)
              .map(([key, value]) => {
                const formattedKey = escapeHtml(key.replace(/_/g, " "));
                let displayValue;

                if (Array.isArray(value)) {
                  displayValue =
                    value.length > 0
                      ? `<span style='color: var(--color-gray)'>[...${value.length} items]</span>`
                      : `<span style='color: var(--color-gray)'>[]</span>`;
                } else if (typeof value === "object" && value !== null) {
                  displayValue = formatObject(value);
                } else if (typeof value === "boolean") {
                  displayValue = `<span class="font-semibold" style="color: ${value ? "var(--color-green)" : "var(--color-red)"}">${escapeHtml(String(value))}</span>`;
                } else {
                  displayValue = `<span style="color: var(--color-blue);">${escapeHtml(JSON.stringify(value))}</span>`;
                }

                return `<div class="mt-1">
                                <span class="capitalize font-semibold" style="color: var(--color-fg-lightest);">${formattedKey}:</span>
                                ${typeof value === "object" && value !== null && !Array.isArray(value) ? displayValue : ` ${displayValue}`}
                           </div>`;
              })
              .join("") +
            "</div>"
          );
        }

        /**
         * Renders the section with the full, formatted API response.
         * @param {object} data - The full API response data.
         * @returns {string} HTML string for the full data section.
         */
        function renderDetailedData(data) {
          if (!data || Object.keys(data).length === 0) {
            return "";
          }

          const formattedDetails = formatObject(data);
          return `
            <section id="detailed-data" class="dashboard-section">
              <h2 class="section-heading">
                <i data-lucide="file-text" class="h-5 w-5" style="color: var(--color-blue);"></i>
                <span>Copilot Usage API Response</span>
              </h2>
              <div class="panel p-4 relative font-mono text-xs code-block overflow-auto" style="max-height: 420px;">
                ${formattedDetails}
              </div>
            </section>
          `;
        }

        function renderTokenUsageSection() {
          const hasTokenUsageContent = Boolean(
            state.isTokenUsageLoading ||
              state.isEventsLoading ||
              state.tokenUsageDailySummary ||
              state.tokenUsageSummary ||
              state.tokenUsageEventsPage ||
              state.tokenUsageDailyError ||
              state.tokenUsageSummaryError ||
              state.tokenUsageEventsError,
          );

          if (!hasTokenUsageContent) {
            return "";
          }

          const dailySummary = getDisplayedMonthData(
            state.tokenUsageDailySummary,
          );
          const summary =
            state.tokenUsagePeriod === "month" && dailySummary
              ? {
                  ...state.tokenUsageSummary,
                  byModel: dailySummary.byModel,
                  range: dailySummary.range,
                  totals: dailySummary.totals,
                }
              : state.tokenUsageSummary;
          const eventsPage = state.tokenUsageEventsPage;
          const visibleEvents = getVisibleTokenUsageEvents(
            eventsPage?.items || [],
          );
          const sessionRows = getSessionUsageRows(visibleEvents);
          const totals = summary?.totals || EMPTY_TOKEN_USAGE_TOTALS;
          const activeRange =
            summary?.range || dailySummary?.range || eventsPage?.range || null;
          const totalPages = eventsPage
            ? Math.max(eventsPage.total_pages, 1)
            : 1;
          const sessionMeta = eventsPage
            ? `${formatNumber(sessionRows.length)} sessions from ${formatNumber(
                visibleEvents.length,
              )} events · Page ${eventsPage.page} / ${totalPages}`
            : "No session data loaded yet.";
          const requestEventsMeta = eventsPage
            ? `${formatNumber(visibleEvents.length)} events · Page ${
                eventsPage.page
              } / ${totalPages} · ${formatNumber(eventsPage.total)} total`
            : "No request events loaded yet.";

          return `
            <section id="token-usage" class="dashboard-section">
              <div class="mb-2 flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                <div class="token-usage-heading">
                  <h2 class="section-heading mb-0">
                    <i data-lucide="database" class="h-5 w-5" style="color: var(--color-blue);"></i>
                    <span>Token Usage</span>
                  </h2>
                  <p class="section-subtitle range-label mb-0">
                    <i data-lucide="calendar-range" class="h-3.5 w-3.5"></i>
                    <span>${escapeHtml(
                      renderTokenUsageRangeText(
                        state.tokenUsagePeriod,
                        activeRange,
                      ),
                    )}</span>
                  </p>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs font-medium" style="color: var(--color-gray);">
                  ${
                    state.isTokenUsageLoading
                      ? `<span class="rounded-md px-2 py-1" style="background-color: var(--info-muted); color: var(--color-blue);">Refreshing summary...</span>`
                      : ""
                  }
                  ${
                    state.isEventsLoading
                      ? `<span class="rounded-md px-2 py-1" style="background-color: var(--info-muted); color: var(--color-blue);">Refreshing details...</span>`
                      : ""
                  }
                </div>
              </div>

              ${
                state.tokenUsageSummaryError
                  ? renderError(
                      state.tokenUsageSummaryError,
                      "Token usage summary failed",
                    )
                  : ""
              }

              <div class="metric-grid metric-grid-tight ${
                state.isTokenUsageLoading ? "opacity-60" : ""
              }">
                ${renderTokenUsageMetric(
                  "Total",
                  totals.total_tokens,
                  "var(--color-fg-lightest)",
                )}
                ${renderTokenUsageMetric(
                  "Input",
                  totals.input_tokens,
                  "var(--color-blue-accent)",
                )}
                ${renderTokenUsageMetric(
                  "Output",
                  totals.output_tokens,
                  "var(--color-green-accent)",
                )}
                ${renderTokenUsageMetric(
                  "Cache Read",
                  totals.cache_read_input_tokens,
                  "var(--color-aqua-accent)",
                )}
                ${renderTokenUsageMetric(
                  "Cache Write",
                  totals.cache_creation_input_tokens,
                  "var(--color-yellow-accent)",
                )}
                ${renderTokenUsageMetric(
                  "Requests",
                  totals.request_count,
                  "var(--color-purple-accent)",
                )}
                ${renderTokenUsageCostMetric(
                  "Cost",
                  formatTokenUsageCosts(totals.costs),
                  "var(--color-yellow-accent)",
                )}
              </div>

              ${renderTokenUsageDailyTrend(
                dailySummary,
                state.tokenUsageDailyError,
              )}

              ${renderDeveloperInsights(summary, dailySummary, state.data)}

              <div class="mt-5 grid grid-cols-1 gap-4">
                <div class="panel">
                  <div class="panel-header flex-col items-start sm:flex-row sm:items-center">
                    <div>
                      <p class="panel-title">Session Usage</p>
                      <p class="panel-meta">${escapeHtml(sessionMeta)}</p>
                    </div>
                  </div>
                  ${renderTokenUsageSessionsTable(sessionRows)}
                </div>
                <div class="panel">
                  <div class="panel-header flex-col items-start sm:flex-row sm:items-center">
                    <div>
                      <p class="panel-title">Request Events</p>
                      <p class="panel-meta">${escapeHtml(requestEventsMeta)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                      ${renderPaginationButton(
                        "previous",
                        "Previous",
                        !eventsPage ||
                          state.isEventsLoading ||
                          eventsPage.page <= 1,
                      )}
                      ${renderPaginationButton(
                        "next",
                        "Next",
                        !eventsPage ||
                          state.isEventsLoading ||
                          eventsPage.page >= totalPages,
                      )}
                    </div>
                  </div>
                  ${
                    state.tokenUsageEventsError
                      ? `<div class="p-4">${renderError(
                          state.tokenUsageEventsError,
                          "Request events failed",
                        )}</div>`
                      : ""
                  }
                  ${renderTokenUsageEventsTable(visibleEvents)}
                </div>
              </div>
            </section>
          `;
        }

        function calculateCacheReuse(totals) {
          const workload =
            (totals.input_tokens || 0) +
            (totals.cache_read_input_tokens || 0) +
            (totals.cache_creation_input_tokens || 0);
          return workload > 0
            ? ((totals.cache_read_input_tokens || 0) / workload) * 100
            : 0;
        }

        function formatAverage(value, count) {
          return count > 0 ? formatNumber(Math.round(value / count)) : "—";
        }

        function formatCostAverage(costs, count) {
          if (!Array.isArray(costs) || costs.length === 0 || count <= 0) {
            return "—";
          }
          return costs
            .map(
              (cost) =>
                `${cost.currency} ${(Number(cost.amount || 0) / count).toFixed(4)}`,
            )
            .join(" · ");
        }

        function renderInsightCard(label, value, note, color) {
          return `
            <div class="metric-card insight-card">
              <div class="metric-label">
                <span class="metric-dot" style="background-color: ${color};"></span>
                <span>${escapeHtml(label)}</span>
              </div>
              <div class="insight-value">${escapeHtml(value)}</div>
              <div class="metric-note">${escapeHtml(note)}</div>
            </div>
          `;
        }

        function renderUsageContext(data) {
          if (!data) return "";
          const resetDate = new Date(data.quota_reset_date);
          const resetText = Number.isNaN(resetDate.getTime())
            ? "Unknown"
            : resetDate.toLocaleString();
          return `
            <div class="context-strip">
              <span>Account <strong>${escapeHtml(data.login || "Unknown")}</strong></span>
              <span>Plan <strong>${escapeHtml(data.copilot_plan || data.access_type_sku || "Unknown")}</strong></span>
              <span>Quota reset <strong>${escapeHtml(resetText)}</strong></span>
              <span>Token billing <strong>${data.token_based_billing ? "Enabled" : "Not reported"}</strong></span>
              <span>Chat <strong>${data.chat_enabled ? "Enabled" : "Disabled"}</strong></span>
            </div>
          `;
        }

        function getBurnProjection(summary) {
          const costs = summary?.totals?.costs || [];
          const range = summary?.range;
          if (!range || costs.length === 0) return "—";
          const now = Date.now();
          const elapsed = Math.max(
            1,
            Math.min(now, range.end_ms) - range.start_ms,
          );
          const duration = Math.max(1, range.end_ms - range.start_ms);
          return costs
            .map((cost) => {
              const projected = Number(cost.amount || 0) * (duration / elapsed);
              return `${cost.currency} ${projected.toFixed(2)}`;
            })
            .join(" · ");
        }

        function getUsageAnomaly(dailySummary) {
          const activeDays = (dailySummary?.days || []).filter(
            (day) => day.totals?.request_count > 0,
          );
          if (activeDays.length < 2) return "";
          const average =
            activeDays.reduce(
              (sum, day) => sum + (day.totals.total_tokens || 0),
              0,
            ) / activeDays.length;
          const peak = activeDays.reduce((current, day) =>
            (day.totals.total_tokens || 0) > (current.totals.total_tokens || 0)
              ? day
              : current,
          );
          if ((peak.totals.total_tokens || 0) < average * 1.5) return "";
          return `${formatChartDate(peak.date)} used ${formatNumber(
            peak.totals.total_tokens,
          )} tokens—${((peak.totals.total_tokens || 0) / average).toFixed(
            1,
          )}× the active-day average.`;
        }

        function renderModelEfficiency(summary) {
          if (!summary?.byModel?.length) return "";
          const rows = summary.byModel
            .map(
              (model) => `
                <tr>
                  <td class="px-4 py-2 font-semibold" style="color: var(--foreground);">${escapeHtml(model.model)}</td>
                  <td class="px-4 py-2 text-right">${formatNumber(model.request_count)}</td>
                  <td class="px-4 py-2 text-right">${formatAverage(model.total_tokens, model.request_count)}</td>
                  <td class="px-4 py-2 text-right">${calculateCacheReuse(model).toFixed(1)}%</td>
                  <td class="px-4 py-2 text-right">${escapeHtml(formatCostAverage(model.costs, model.request_count))}</td>
                  <td class="px-4 py-2 text-right">${model.total_nano_aiu === null ? "—" : formatAverage(model.total_nano_aiu, model.request_count)}</td>
                </tr>`,
            )
            .join("");
          return `
            <div class="panel">
              <div class="panel-header"><div><p class="panel-title">Model Efficiency</p><p class="panel-meta">Compare cost and context efficiency before choosing an agent model.</p></div></div>
              <div class="overflow-auto">
                <table class="data-table min-w-[760px] text-left">
                  <thead><tr>
                    <th class="px-4 py-2">Model</th><th class="px-4 py-2 text-right">Requests</th>
                    <th class="px-4 py-2 text-right">Tokens / req</th><th class="px-4 py-2 text-right">Cache reuse</th>
                    <th class="px-4 py-2 text-right">Cost / req</th><th class="px-4 py-2 text-right">AIU / req</th>
                  </tr></thead><tbody>${rows}</tbody>
                </table>
              </div>
            </div>`;
        }

        function renderDeveloperInsights(summary, dailySummary, usageData) {
          if (!summary) return "";
          const totals = summary.totals || EMPTY_TOKEN_USAGE_TOTALS;
          const mostExpensiveModel = [...(summary.byModel || [])].sort(
            (left, right) =>
              (right.costs?.[0]?.amount || 0) - (left.costs?.[0]?.amount || 0),
          )[0];
          const anomaly = getUsageAnomaly(dailySummary);
          return `
            <div class="insights-block">
              <h3 class="section-heading"><i data-lucide="activity" class="h-5 w-5" style="color: var(--color-green);"></i><span>Agent Efficiency</span></h3>
              ${renderUsageContext(usageData)}
              <div class="insight-grid">
                ${renderInsightCard("Cache reuse", `${calculateCacheReuse(totals).toFixed(1)}%`, "Higher is better for long agent sessions", "var(--color-aqua)")}
                ${renderInsightCard("Tokens / request", formatAverage(totals.total_tokens, totals.request_count), "Average context and output footprint", "var(--color-blue)")}
                ${renderInsightCard("Cost / request", formatCostAverage(totals.costs, totals.request_count), "Average estimated request cost", "var(--color-yellow)")}
                ${renderInsightCard("AIU / request", totals.total_nano_aiu === null ? "—" : formatAverage(totals.total_nano_aiu, totals.request_count), "Copilot consumption per request", "var(--color-purple)")}
                ${renderInsightCard("Projected period cost", getBurnProjection(summary), "Current spend pace through period end", "var(--color-orange)")}
                ${renderInsightCard("Highest-cost model", mostExpensiveModel?.model || "—", mostExpensiveModel ? formatTokenUsageCosts(mostExpensiveModel.costs).join(" · ") : "No priced usage", "var(--color-red)")}
              </div>
              ${anomaly ? `<div class="insight-note"><strong>Usage anomaly:</strong> ${escapeHtml(anomaly)}</div>` : ""}
              <div class="mt-5 grid grid-cols-1 gap-4">
                ${renderModelEfficiency(summary)}
              </div>
            </div>`;
        }

        function getTokenUsageTrendMetrics() {
          return [
            {
              color: "var(--color-fg-lightest)",
              key: "total_tokens",
              label: "Total",
            },
            {
              color: "var(--color-blue-accent)",
              key: "input_tokens",
              label: "Input",
            },
            {
              color: "var(--color-green-accent)",
              key: "output_tokens",
              label: "Output",
            },
            {
              color: "var(--color-aqua-accent)",
              key: "cache_read_input_tokens",
              label: "Cache Read",
            },
            {
              color: "var(--color-yellow-accent)",
              key: "cache_creation_input_tokens",
              label: "Cache Write",
            },
          ];
        }

        function getDailyTrendTotals(day, selectedModel) {
          if (selectedModel === ALL_MODELS_VALUE) {
            return day.totals || EMPTY_TOKEN_USAGE_TOTALS;
          }

          return (
            day.byModel?.find((model) => model.model === selectedModel) ||
            EMPTY_TOKEN_USAGE_TOTALS
          );
        }

        function formatChartDate(value) {
          const parts = String(value).split("-");
          return parts.length === 3 ? `${parts[1]}/${parts[2]}` : value;
        }

        function renderTokenUsageDailyTrend(dailySummary, error) {
          if (state.tokenUsagePeriod === "day") {
            return "";
          }

          const models = dailySummary?.byModel || [];
          const selectedModel = models.some(
            (model) => model.model === state.tokenUsageTrendModel,
          )
            ? state.tokenUsageTrendModel
            : ALL_MODELS_VALUE;
          const options = [
            `<option value="${ALL_MODELS_VALUE}">All models</option>`,
            ...models.map(
              (model) =>
                `<option value="${escapeHtml(model.model)}" ${
                  selectedModel === model.model ? "selected" : ""
                }>${escapeHtml(model.model)}</option>`,
            ),
          ].join("");

          return `
            <div class="mt-5 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_320px] gap-4">
              <div class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Token Usage Over Time</p>
                    <p class="panel-meta">${escapeHtml(
                      renderTokenUsageRangeText(
                        state.tokenUsagePeriod,
                        dailySummary?.range || null,
                      ),
                    )}</p>
                  </div>
                </div>
                ${
                  error
                    ? `<div class="p-4">${renderError(
                        error,
                        "Token usage daily trend failed",
                      )}</div>`
                    : ""
                }
                ${renderTokenUsageTrendChart(dailySummary, selectedModel)}
              </div>

              <aside class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Filters</p>
                    <p class="panel-meta">Applied to the trend chart</p>
                  </div>
                </div>
                <div class="p-4 space-y-4">
                  <div>
                    <label class="field-label">Model</label>
                    <div class="select-shell">
                      <select
                        data-token-usage-trend-model
                        class="select-control input-focus text-sm"
                      >${options}</select>
                      <i data-lucide="chevron-down" aria-hidden="true"></i>
                    </div>
                  </div>
                  <div>
                    <div class="field-label">Metric</div>
                    <div class="flex flex-wrap gap-2">
                      ${renderTokenUsageTrendMetricButtons()}
                    </div>
                  </div>
                </div>
              </aside>
            </div>
          `;
        }

        function renderTokenUsageTrendMetricButtons() {
          const metrics = getTokenUsageTrendMetrics();
          return [
            {
              color: "var(--color-fg-lightest)",
              key: ALL_METRICS_VALUE,
              label: "All",
            },
            ...metrics,
          ]
            .map((metric) => {
              const isActive = state.tokenUsageTrendMetric === metric.key;
              return `
                <button
                  type="button"
                  data-trend-metric="${metric.key}"
                  class="pill-button inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold"
                  style="background-color: ${isActive ? "var(--info-muted)" : "var(--color-bg)"}; border-color: ${isActive ? "var(--info-border)" : "var(--color-bg-light-2)"}; color: ${isActive ? "var(--color-blue)" : "var(--color-fg-medium)"};"
                >
                  <span class="h-2 w-2 rounded-full" style="background-color: ${metric.color};"></span>
                  ${escapeHtml(metric.label)}
                </button>
              `;
            })
            .join("");
        }

        function renderTokenUsageTrendChart(dailySummary, selectedModel) {
          const days = dailySummary?.days || [];
          const metrics = getTokenUsageTrendMetrics();
          const visibleMetrics =
            state.tokenUsageTrendMetric === ALL_METRICS_VALUE
              ? metrics
              : metrics.filter(
                  (metric) => metric.key === state.tokenUsageTrendMetric,
                );
          const hasUsage = days.some(
            (day) => getDailyTrendTotals(day, selectedModel).request_count > 0,
          );
          const activeIndex =
            Number.isInteger(state.tokenUsageTrendDayIndex) &&
            state.tokenUsageTrendDayIndex >= 0 &&
            state.tokenUsageTrendDayIndex < days.length
              ? state.tokenUsageTrendDayIndex
              : -1;
          const activeDay = days[activeIndex];
          const activeTotals = activeDay
            ? getDailyTrendTotals(activeDay, selectedModel)
            : EMPTY_TOKEN_USAGE_TOTALS;

          if (state.isTokenUsageLoading && !dailySummary) {
            return `<div class="p-4 min-h-[14rem] text-sm animate-pulse" style="color: var(--color-gray);">Loading...</div>`;
          }

          if (!dailySummary || days.length === 0 || !hasUsage) {
            return renderEmptyState(
              "No token usage recorded for the selected period.",
            );
          }

          const width = 720;
          const height = 220;
          const padding = { bottom: 34, left: 58, right: 16, top: 16 };
          const plotWidth = width - padding.left - padding.right;
          const plotHeight = height - padding.top - padding.bottom;
          const allValues = days.flatMap((day) => {
            const totals = getDailyTrendTotals(day, selectedModel);
            return visibleMetrics.map((metric) => totals[metric.key] || 0);
          });
          const maxValue = Math.max(1, ...allValues);
          const xForIndex = (index) =>
            days.length <= 1
              ? padding.left + plotWidth / 2
              : padding.left + (plotWidth * index) / (days.length - 1);
          const hitWidth =
            days.length <= 1 ? plotWidth : plotWidth / (days.length - 1);
          const yForValue = (value) =>
            padding.top +
            plotHeight -
            (Math.max(0, value) / maxValue) * plotHeight;
          const labelEvery = Math.max(1, Math.ceil(days.length / 6));
          const yTicks = [0, 0.25, 0.5, 0.75, 1].map((ratio) =>
            Math.round(maxValue * ratio),
          );

          const grid = yTicks
            .map((tick) => {
              const y = yForValue(tick);
              return `
                <line x1="${padding.left}" x2="${
                  width - padding.right
                }" y1="${y}" y2="${y}" stroke="var(--color-bg-light-2)" stroke-width="1" />
                <text x="${padding.left - 8}" y="${
                  y + 4
                }" text-anchor="end" font-size="11" fill="var(--color-gray-accent)">${formatNumber(
                  tick,
                )}</text>
              `;
            })
            .join("");
          const xLabels = days
            .map((day, index) => {
              if (index % labelEvery !== 0 && index !== days.length - 1) {
                return "";
              }
              return `<text x="${xForIndex(index)}" y="${
                height - 10
              }" text-anchor="middle" font-size="11" fill="var(--color-gray-accent)">${escapeHtml(
                formatChartDate(day.date),
              )}</text>`;
            })
            .join("");
          const lines = visibleMetrics
            .map((metric) => {
              const points = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  return `${xForIndex(index)},${yForValue(
                    totals[metric.key] || 0,
                  )}`;
                })
                .join(" ");
              const circles = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  const value = totals[metric.key] || 0;
                  return `<circle cx="${xForIndex(index)}" cy="${yForValue(
                    value,
                  )}" r="2.5" fill="${
                    metric.color
                  }" data-trend-day-index="${index}">
                    <title>${escapeHtml(
                      `${formatChartDate(day.date)} ${metric.label}: ${formatNumber(
                        value,
                      )}`,
                    )}</title>
                  </circle>`;
                })
                .join("");
              return `
