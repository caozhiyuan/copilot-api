<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot API Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"></script>

    <style>
      :root {
        --page-zoom: 0.9;
        zoom: var(--page-zoom);

        --color-red: #dc2626;
        --color-green: #16a34a;
        --color-yellow: #d97706;
        --color-blue: #2563eb;
        --color-purple: #7c3aed;
        --color-aqua: #0891b2;
        --color-orange: #ea580c;
        --color-gray: #64748b;

        --color-red-accent: #ef4444;
        --color-green-accent: #22c55e;
        --color-yellow-accent: #f59e0b;
        --color-blue-accent: #1d4ed8;
        --color-purple-accent: #8b5cf6;
        --color-aqua-accent: #0ea5e9;
        --color-orange-accent: #f97316;
        --color-gray-accent: #94a3b8;

        --color-bg-darkest: #0f172a;
        --color-bg: #ffffff;
        --color-bg-light-1: #f8fafc;
        --color-bg-light-2: #e2e8f0;
        --color-bg-light-3: #cbd5e1;
        --color-bg-light-4: #94a3b8;
        --color-bg-soft: #f1f5f9;

        --color-fg-darker: #64748b;
        --color-fg-dark: #475569;
        --color-fg-medium: #334155;
        --color-fg-light: #1e293b;
        --color-fg-lightest: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #eef2f7;
        color: var(--color-fg-light);
      }

      .app-shell {
        min-height: calc(100vh / var(--page-zoom));
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      }

      .main-shell {
        min-width: 0;
        padding: 16px 24px 24px;
      }

      .topbar {
        margin: 0 auto 10px;
        max-width: 1720px;
      }

      .topbar-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }

      .page-title {
        font-size: clamp(28px, 3vw, 38px);
        font-weight: 750;
        line-height: 1.05;
        color: var(--color-fg-lightest);
      }

      .page-subtitle {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 14px;
      }

      .control-surface {
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(220px, 320px)
          150px
          132px;
        gap: 12px;
        align-items: end;
      }

      [hidden] {
        display: none !important;
      }

      .page-tabs {
        display: inline-flex;
        max-width: 100%;
        gap: 4px;
        margin-bottom: 14px;
        padding: 4px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.88);
      }

      .page-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 7px;
        color: var(--color-gray);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .page-tab[aria-selected="true"] {
        background: var(--color-blue);
        color: #ffffff;
      }

      .page-tab:focus-visible,
      .models-action:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 3px;
      }

      .control-surface.models-view {
        grid-template-columns: minmax(320px, 1fr) minmax(220px, 320px) 132px;
      }

      .models-toolbar {
        flex-wrap: wrap;
        padding: 14px;
      }

      .models-toolbar .models-search {
        width: min(340px, 100%);
      }

      .models-table-scroll {
        overflow-x: auto;
      }

      .models-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
        table-layout: fixed;
        text-align: left;
        font-size: 13px;
      }

      .models-table th,
      .models-table td {
        padding: 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
        overflow-wrap: anywhere;
      }

      .models-table th {
        background: #f8fafc;
        color: var(--color-gray);
        font-size: 12px;
        font-weight: 700;
      }

      .models-id {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .models-id code {
        min-width: 0;
        color: var(--color-fg-lightest);
        font-size: 12px;
      }

      .models-action {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        color: var(--color-blue);
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .models-action:hover {
        color: var(--color-blue-accent);
        text-decoration: underline;
      }

      .models-table .models-json-cell {
        padding: 0;
      }

      .models-json {
        margin: 0;
        max-height: 480px;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
        color: var(--color-fg-medium);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--color-fg-medium);
        font-size: 12px;
        font-weight: 700;
      }

      .input-control,
      .select-control {
        width: 100%;
        height: 42px;
        border: 1px solid var(--color-bg-light-3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--color-fg-lightest);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.16s ease;
      }

      .input-control {
        padding: 0 12px;
      }

      .select-control {
        padding: 0 34px 0 12px;
      }

      .input-control::placeholder {
        color: #94a3b8;
      }

      .primary-action {
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--color-blue);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        transition:
          background-color 0.16s ease,
          transform 0.16s ease;
      }

      .primary-action:hover {
        background: var(--color-blue-accent);
      }

      .content-area {
        max-width: 1720px;
        margin: 0 auto;
      }

      .dashboard-section {
        margin-bottom: 10px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        color: var(--color-fg-lightest);
        font-size: 16px;
        font-weight: 750;
      }

      .collapse-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .collapse-toggle:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .collapse-chevron {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--color-gray);
      }

      .collapse-toggle[aria-expanded="false"] .collapse-chevron {
        transform: rotate(-90deg);
      }

      .collapse-body[hidden] {
        display: none !important;
      }

      .panel-header:has(+ .collapse-body[hidden]) {
        border-bottom-color: transparent;
      }

      .section-subtitle {
        margin-top: -4px;
        margin-bottom: 8px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .panel {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .panel-title {
        color: var(--color-fg-lightest);
        font-size: 14px;
        font-weight: 750;
      }

      .panel-meta {
        margin-top: 2px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .metric-grid-tight {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .subscription-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      }

      .metric-grid-tight .metric-label {
        white-space: nowrap;
      }

      .metric-card {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      }

      .metric-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-fg-medium);
        font-size: 13px;
        font-weight: 650;
      }

      .metric-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .metric-value {
        margin-top: 10px;
        color: var(--color-fg-lightest);
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 800;
        line-height: 1.1;
      }

      .metric-note {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .progress-bar-bg {
        background-color: var(--color-bg-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar-fg {
        border-radius: 999px;
        transition: width 0.5s ease-in-out;
      }

      .code-block::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .code-block::-webkit-scrollbar-track {
        background: var(--color-bg-light-1);
      }

      .code-block::-webkit-scrollbar-thumb {
        background: var(--color-bg-light-3);
        border-radius: 999px;
      }

      .code-block::-webkit-scrollbar-thumb:hover {
        background: var(--color-bg-light-4);
      }

      .input-focus:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .data-table thead {
        background: var(--color-bg-light-1);
        color: var(--color-fg-medium);
      }

      .data-table th {
        font-size: 12px;
        font-weight: 750;
      }

      .data-table td {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .pill-button {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 7px;
        background: var(--color-bg);
        color: var(--color-fg-medium);
      }

      .quick-state-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      @media (max-width: 899px) {
        .metric-grid-tight {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 1100px) {
        .control-surface {
          grid-template-columns: minmax(0, 1fr) 170px 132px;
        }

        .endpoint-field {
          grid-column: 1 / -1;
        }

        .control-surface.models-view {
          grid-template-columns: minmax(0, 1fr) 132px;
        }
      }

      @media (max-width: 639px) {
        .page-tabs { display: flex; width: 100%; gap: 2px; }
        .page-tab { flex: 1 1 auto; min-width: 0; justify-content: center; gap: 5px; padding: 8px; font-size: 12px; white-space: nowrap; }
        .main-shell {
          padding: 12px 14px 18px;
        }

        .topbar-row {
          display: block;
        }

        .control-surface,
        .control-surface.models-view {
          grid-template-columns: 1fr;
        }

        .models-toolbar .models-search {
          width: 100%;
        }

        .endpoint-field {
          grid-column: auto;
        }

        .metric-grid-tight {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

/* Subscription allowance workspace. Provider SVGs are bundled from models.dev. */
.subscriptions-page {
  --quota-text: var(--color-ink, var(--color-fg-lightest));
  --quota-muted: var(--color-ink-soft, var(--color-gray));
  --quota-faint: var(--color-ink-faint, var(--color-fg-darker));
  --quota-line: var(--color-line, var(--color-bg-light-2));
  --quota-soft: var(--color-sunken, var(--color-bg-light-1));
  --quota-surface: var(--color-surface, var(--color-bg));
  padding: 0;
  color: var(--quota-text);
}
.subscriptions-page-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 26px; }
.subscriptions-eyebrow { margin: 0 0 7px; font-size: 10px; font-weight: 650; letter-spacing: .16em; color: var(--quota-faint); }
.subscriptions-page-heading h2 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: -.04em; line-height: 1.25; }
.subscriptions-description { margin: 9px 0 0; font-size: 13px; line-height: 1.6; color: var(--quota-muted); }
.subscriptions-count { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; padding: 7px 11px; border: 1px solid var(--quota-line); border-radius: 99px; font-size: 11px; color: var(--quota-muted); background: var(--quota-surface); }
.subscriptions-count > span { width: 5px; height: 5px; border-radius: 50%; background: #22a06b; }
.subscriptions-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
.quota-provider-card { --quota-brand: #7c5ac7; position: relative; min-width: 0; padding: 22px 20px 14px; overflow: hidden; border: 1px solid var(--quota-line); border-radius: 18px; background: var(--quota-surface); box-shadow: 0 3px 12px rgb(0 0 0 / 2%); }
.quota-provider-card[data-provider="codex"] { --quota-brand: #179876; }
.quota-provider-card[data-provider="xai"] { --quota-brand: #386fce; }
.dark .quota-provider-card { --quota-brand: #b095ef; }
.dark .quota-provider-card[data-provider="codex"] { --quota-brand: #50bd9b; }
.dark .quota-provider-card[data-provider="xai"] { --quota-brand: #7aa8f1; }
.quota-card-header { display: flex; align-items: center; gap: 11px; }
.quota-provider-logo { display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--quota-line); border-radius: 13px; background: var(--quota-soft); }
.quota-provider-logo img { width: 32px; height: 32px; object-fit: contain; }
.quota-card-header h3 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.025em; line-height: 1.3; }
.quota-provider-product { margin: 3px 0 0; font-size: 11px; color: var(--quota-faint); }
.quota-refresh { display: grid; place-items: center; flex-shrink: 0; width: 30px; height: 30px; padding: 0; margin-left: auto; border: 1px solid var(--quota-line); border-radius: 9px; color: var(--quota-muted); background: var(--quota-surface); cursor: pointer; }
.quota-refresh:hover { background: var(--quota-soft); color: var(--quota-text); }
.quota-refresh:disabled { opacity: .45; cursor: default; }
.quota-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 17px 0 0; }
.quota-plan { min-width: 0; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: var(--quota-soft); color: var(--quota-muted); font-size: 11px; font-weight: 500; }
.quota-status { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 10px; color: var(--quota-faint); }
.quota-status > span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.quota-status[data-state="ready"] { color: var(--quota-muted); }
.quota-status[data-state="warning"] { color: #d58a25; }
.quota-summary { margin: 18px 0 22px; padding: 18px; border-radius: 13px; background: color-mix(in srgb, var(--quota-brand) 4%, var(--quota-soft)); }
.quota-summary-label { margin: 0 0 9px; font-size: 11px; font-weight: 500; color: var(--quota-muted); }
.quota-summary-value { font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.quota-summary-context { margin: 9px 0 0; font-size: 11px; color: var(--quota-faint); }
.quota-details { font-size: 12px; }
.quota-window + .quota-window { margin-top: 18px; }
.quota-window-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; font-size: 12px; }
.quota-window-heading > :first-child { color: var(--quota-muted); }
.quota-window-heading > :last-child { font-weight: 550; color: var(--quota-text); }
.quota-progress { height: 6px; overflow: hidden; border-radius: 99px; background: var(--quota-soft); }
.quota-progress-fill { height: 100%; border-radius: inherit; background: var(--quota-brand); transition: width .25s ease; }
.quota-window[data-warning="true"] .quota-progress-fill { background: #d58a25; }
.quota-window-note { margin: 6px 0 0; font-size: 11px; color: var(--quota-faint); line-height: 1.5; }
.quota-balance { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--quota-line); font-size: 12px; color: var(--quota-muted); }
.quota-balance strong { color: var(--quota-text); font-weight: 600; }
.quota-notice { margin: 0 0 15px; padding: 10px 12px; border-radius: 9px; background: rgb(213 138 37 / 8%); color: #b67822; font-size: 12px; line-height: 1.6; }
.quota-card-footer { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--quota-line); color: var(--quota-faint); font-size: 10px; }
.quota-card-message { display: flex; align-items: center; min-height: 180px; margin: 0; font-size: 12px; line-height: 1.8; color: var(--quota-muted); }
.quota-card-message[role="alert"] { color: #b67822; }
.quota-skeleton { display: flex; flex-direction: column; justify-content: center; gap: 16px; min-height: 230px; animation: quota-pulse 1.5s ease-in-out infinite; }
.quota-skeleton > div { height: 9px; border-radius: 6px; background: var(--quota-soft); }
.quota-skeleton > div:first-child { width: 55%; height: 42px; margin-bottom: 22px; }
.quota-skeleton > div:last-child { width: 75%; }
@keyframes quota-pulse { 50% { opacity: .45; } }
.subscriptions-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 260px; padding: 30px; text-align: center; border: 1px dashed var(--quota-line); border-radius: 18px; color: var(--quota-muted); font-size: 13px; }
.subscriptions-empty h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--quota-text); }
.subscriptions-empty p { max-width: 360px; margin: 0; line-height: 1.7; }
.subscriptions-action { margin-top: 5px; border: 0; border-radius: 9px; padding: 8px 14px; background: var(--quota-text); color: var(--quota-surface); cursor: pointer; font-size: 12px; }
@media (max-width: 899px) {
  .subscriptions-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 639px) {
  .subscriptions-page-heading { align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-direction: column; }
  .subscriptions-page-heading h2 { font-size: 23px; }
  .subscriptions-grid { grid-template-columns: minmax(0, 1fr); }
  .quota-provider-card { padding: 20px 18px 14px; }
}
    </style>
  </head>
  <body class="antialiased">
    <div id="app" class="app-shell">
      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-row">
            <div>
              <h1 class="page-title">Copilot API Dashboard</h1>
              <p class="page-subtitle">Token usage and available models</p>
            </div>
          </div>

          <div
            id="page-tabs"
            class="page-tabs"
            role="tablist"
            aria-label="Dashboard views"
          >
            <button
              id="usage-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="usage"
              aria-selected="true"
              aria-controls="content-area"
            >
              <i data-lucide="bar-chart-3" class="h-4 w-4" aria-hidden="true"></i>
              Token Usage
            </button>
            <button id="subscriptions-tab" type="button" class="page-tab" role="tab" data-tab="subscriptions" aria-selected="false" aria-controls="content-area" tabindex="-1">
              <i data-lucide="gauge" class="h-4 w-4" aria-hidden="true"></i>
              Subscriptions
            </button>
            <button
              id="models-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="models"
              aria-selected="false"
              aria-controls="content-area"
              tabindex="-1"
            >
              <i data-lucide="boxes" class="h-4 w-4" aria-hidden="true"></i>
              Models
            </button>
          </div>

          <form id="endpoint-form" class="control-surface">
            <div class="endpoint-field">
              <label for="endpoint-url" class="field-label">Endpoint URL</label>
              <input
                type="text"
                id="endpoint-url"

            .replaceAll("'", "&#39;");
