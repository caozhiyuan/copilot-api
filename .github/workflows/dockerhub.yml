name: DockerHub Build and Push

on:
  push:
    branches-ignore:
      - release
    tags:
      - "v*"

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64,amd64

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          raw="${GITHUB_REF#refs/heads/}"
          clean=$(echo "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#/#-#g' \
            | sed 's/[^a-z0-9._-]/-/g' \
            | sed 's/-\{2,\}/-/g' \
            | sed 's/^[^a-z0-9]\+//; s/[^a-z0-9]\+$//' \
            | cut -c1-128)

          if [[ -z "$clean" ]]; then
            clean="branch"
          fi

          echo "tag=$clean" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/copilot-api:${{ steps.tag.outputs.tag }}
          platforms: ${{ steps.tag.outputs.platforms }}
