name: Docker Build and Push

on:
  push:
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths:
      - "src/**"
      - "pages/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".dockerignore"
      - ".github/workflows/release-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run lint:all
      - run: bun run typecheck:all
      - run: bun test
      - name: Validate Compose variants when available
        if: hashFiles('docker-compose.yaml') != ''
        run: |
          docker compose config --quiet
          if [ -f docker-compose.bind.yaml ]; then
            docker compose -f docker-compose.yaml -f docker-compose.bind.yaml config --quiet
          fi
      - name: Build native image
        run: docker build --tag copilot-api:test .
      - name: Test container lifecycle when available
        if: hashFiles('tests/docker-smoke.test.ts') != ''
        run: bun test tests/docker-smoke.test.ts
        env:
          COPILOT_API_DOCKER_TEST_IMAGE: copilot-api:test

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare registry metadata
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
