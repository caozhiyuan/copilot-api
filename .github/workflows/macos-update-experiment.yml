name: Temporary macOS update experiment
on:
  push:
    branches: [feat/macos-differential-update]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      EXPERIMENT_DIR: ${{ github.workspace }}/macos-update-experiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: |
          mkdir -p "$EXPERIMENT_DIR"
          bun install --frozen-lockfile
          bun install --cwd desktop --frozen-lockfile
      - name: Typecheck desktop
        run: bun run --cwd desktop typecheck
      - name: Verify update unit tests
        run: |
          bun test --coverage desktop/tests/update-files.test.ts desktop/tests/mac-dmg-updater.test.ts desktop/tests/mac-update-install.test.ts desktop/tests/update-manager.test.ts desktop/tests/app-update-panel.test.ts desktop/tests/release-update.test.ts > "$EXPERIMENT_DIR/verification.log" 2>&1
          tail -24 "$EXPERIMENT_DIR/verification.log"
      - name: Build original app and DMG
        run: |
          mkdir -p "$EXPERIMENT_DIR/old"
          bun run --cwd desktop package:mac
          app_path=$(find desktop/release -maxdepth 2 -name 'Copilot API.app' -type d | head -1)
          ditto "$app_path" "$EXPERIMENT_DIR/old/Copilot API.app"
          cp desktop/release/Copilot.API-2.7.43-*.dmg "$EXPERIMENT_DIR/old.dmg"
          cp desktop/release/Copilot.API-2.7.43-*.dmg.blockmap "$EXPERIMENT_DIR/old.dmg.blockmap"
      - name: Build next version
        run: |
          node -e 'const fs=require("fs");const p="desktop/package.json";const x=JSON.parse(fs.readFileSync(p));x.version="2.7.44";fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
          bun run --cwd desktop package:mac
          cp desktop/release/Copilot.API-2.7.44-*.dmg "$EXPERIMENT_DIR/new.dmg"
          cp desktop/release/Copilot.API-2.7.44-*.dmg.blockmap "$EXPERIMENT_DIR/new.dmg.blockmap"
          test -f desktop/release/latest-mac.yml
      - name: Build intentionally failing startup fixture
        working-directory: desktop
        run: |
          node -e 'const fs=require("fs");const p="package.json";const x=JSON.parse(fs.readFileSync(p));x.version="2.7.45";fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");fs.writeFileSync("out/main/index.js","require(\"electron\").app.exit(77)\n")'
          node node_modules/electron-builder/cli.js --mac --publish never
          cp release/Copilot.API-2.7.45-*.dmg "$EXPERIMENT_DIR/failed.dmg"
          cp release/Copilot.API-2.7.45-*.dmg.blockmap "$EXPERIMENT_DIR/failed.dmg.blockmap"
      - name: Run real differential HTTP download in Electron
        run: |
          bun build .github/scripts/macos-update-download-experiment.ts --target=node --format=cjs --external electron --external electron-updater --outfile desktop/ci-update-experiment.cjs
          desktop/node_modules/.bin/electron desktop/ci-update-experiment.cjs
      - name: Run unsigned app replacement and restart
        run: bun run .github/scripts/macos-update-install-experiment.ts
      - name: Verify rollback after startup failure
        run: bun run .github/scripts/macos-update-install-experiment.ts --expect-rollback
      - name: Gatekeeper diagnostics
        if: always()
        run: |
          for target in "$EXPERIMENT_DIR/old/Copilot API.app" "$EXPERIMENT_DIR/install/Copilot API.app"; do
            if [ -d "$target" ]; then
              codesign --display --verbose=4 "$target" 2>&1 || true
              spctl --assess --type execute --verbose=4 "$target" 2>&1 || true
              xattr -l "$target" || true
            fi
          done
          screencapture -x "$EXPERIMENT_DIR/macos.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-update-experiment
          path: |
            macos-update-experiment/*.json
            macos-update-experiment/*.log
            macos-update-experiment/*.png
            macos-update-experiment/install-result/**
          if-no-files-found: warn
